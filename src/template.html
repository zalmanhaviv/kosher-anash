<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials"><link rel="apple-touch-icon" href="/icon-180.png"><link rel="icon" type="image/png" href="/icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="כשר לאנ״ש">
<title>כשר לאנ״ש – מסעדות כשרות לידך</title>
<link rel="stylesheet" href="/vendor/fonts.css">
<style>
:root{
  --ink:#16191f;--sub:#5b6270;--mut:#6b7280;--line:#e8eaee;--bg:#f3f4f6;--card:#fff;
  --brand:#1d3a6e;--brandbg:#eef2f9;--open:#0e7c47;--closed:#c0392b;
  --chabad:#2456b3;--eda:#5b3a8c;--landa:#8a5a12;--products:#4a6274;--soon:#b45309;
  --sh1:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.08);
  --sh2:0 -2px 18px rgba(16,24,40,.14);
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Assistant,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- map ---------- */
#map{position:fixed;inset:0;z-index:0;background:#eef0f2}
#svgmap{position:fixed;inset:0;width:100%;height:100%;z-index:0;background:#eef0f2}

/* ---------- top bar ---------- */
.topbar{position:fixed;top:calc(10px + var(--st));right:12px;left:12px;z-index:30;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.topbar>*{pointer-events:auto}
.sbar{display:flex;align-items:center;gap:4px;height:52px;background:var(--card);border-radius:14px;box-shadow:var(--sh1);padding:0 6px 0 8px}
.brandmark{flex:0 0 auto;font-weight:800;font-size:16px;color:var(--brand);padding:0 8px 0 4px;letter-spacing:-.2px;white-space:nowrap}
.sbar .sep{width:1px;height:24px;background:var(--line)}
.sbar input{flex:1;min-width:0;border:0;outline:0;background:transparent;height:100%;font-size:16px;padding:0 8px}
.sbar input::placeholder{color:var(--mut)}
.ibtn{flex:0 0 44px;height:44px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;color:var(--sub);position:relative}
.ibtn:hover{background:var(--bg)}
.ibtn .badge{position:absolute;top:5px;left:5px;min-width:16px;height:16px;border-radius:8px;background:var(--brand);color:#fff;font-size:10.5px;font-weight:700;display:none;place-items:center;padding:0 4px}
.ibtn .badge.on{display:grid}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;margin:0 -12px;padding-inline:12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:38px;padding:0 13px;border-radius:999px;border:0;background:var(--card);box-shadow:var(--sh1);font-size:14px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--brand);color:#fff}
.chip .d{width:8px;height:8px;border-radius:50%;background:var(--open)}
.chip.on .d{background:#7ee2ad}

/* ---------- floating map buttons ---------- */
.fab{position:fixed;z-index:20;left:12px;width:44px;height:44px;border-radius:12px;border:0;background:var(--card);box-shadow:var(--sh1);display:grid;place-items:center;color:var(--brand);transition:bottom .25s}

/* ---------- sheet ---------- */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:25;height:calc(100% - 64px - var(--st));background:var(--card);border-radius:18px 18px 0 0;box-shadow:var(--sh2);display:flex;flex-direction:column;transform:translateY(calc(100% - 168px));transition:transform .32s cubic-bezier(.2,.8,.2,1);will-change:transform;touch-action:none}
.sheet.drag{transition:none}
.shead{flex:0 0 auto;padding:8px 16px 10px;cursor:grab}
.grab{width:36px;height:5px;border-radius:3px;background:#d6d9de;margin:0 auto 10px}
.stitle{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.stitle h2{margin:0;font-size:18px;font-weight:700}
.stitle span{font-size:13.5px;color:var(--sub)}
.sbody{flex:1;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding-bottom:calc(16px + var(--sb))}
.sec-h{font-size:13px;font-weight:700;color:var(--sub);padding:14px 16px 6px}
.item{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:right;border:0;background:transparent;padding:12px 16px;border-top:1px solid var(--line)}
.item:hover{background:#fafbfc}
.item .pinx{flex:0 0 36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;margin-top:2px;position:relative}
.pinx i{position:absolute;bottom:-4px;left:-4px;min-width:16px;height:16px;border-radius:8px;background:#fff;color:var(--ink);font:800 10.5px/16px Assistant,sans-serif;font-style:normal;text-align:center;box-shadow:0 0 0 1px var(--line)}
.item .bd{flex:1;min-width:0}
.item .nm{font-size:16px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .l2{font-size:14px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .l3{display:flex;flex-wrap:wrap;column-gap:10px;row-gap:2px;font-size:13.5px;margin-top:3px;align-items:center}
.item .kh{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .ds{flex:0 0 auto;font-size:13.5px;font-weight:600;color:var(--ink);text-align:left;margin-top:3px}
.st-y{color:var(--open);font-weight:700}.st-n{color:var(--closed);font-weight:600}.st-u{color:var(--sub);font-weight:600}.st-s{color:var(--soon);font-weight:700}.st-x{color:var(--closed);font-weight:700;text-decoration:line-through}
.k-chabad{color:var(--chabad)}.k-eda{color:var(--eda)}.k-landa{color:var(--landa)}.k-products{color:var(--products)}
.b-chabad{background:var(--chabad)}.b-eda{background:var(--eda)}.b-landa{background:var(--landa)}.b-products{background:var(--products)}
.more{display:block;margin:12px auto;height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;color:var(--sub)}
.empty{padding:40px 24px;text-align:center;color:var(--sub);line-height:1.5}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.cta{display:flex;gap:12px;align-items:center;margin:4px 16px 8px;padding:12px 14px;border-radius:12px;background:var(--brandbg)}
.cta p{margin:0;flex:1;font-size:14px;color:var(--sub);line-height:1.4}
.cta p b{display:block;color:var(--ink);font-size:15px}
.btn{height:44px;padding:0 14px;border-radius:10px;border:0;font-weight:700;white-space:nowrap}
.btn.pri{background:var(--brand);color:#fff}
.btn.ghost{background:var(--bg);color:var(--ink)}
.note{margin:4px 16px 8px;padding:10px 12px;border-radius:10px;background:#fff8e6;color:#7a4b00;font-size:13.5px;line-height:1.45}
.foot{padding:18px 16px 4px;font-size:12.5px;color:var(--mut);line-height:1.6}
.foot a{color:var(--sub)}

/* ---------- place detail ---------- */
.det{padding:0 16px}
.det .back{display:flex;align-items:center;gap:4px;border:0;background:transparent;color:var(--sub);font-weight:600;padding:0;height:44px;margin-bottom:0}
.det h3{margin:0;font-size:22px;font-weight:800;line-height:1.25}
.det .addr{color:var(--sub);font-size:15px;margin-top:2px}
.det .row{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:14.5px;align-items:center}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.acts a,.acts button{height:58px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--brand);text-decoration:none;font-size:13px;font-weight:700}
.acts a.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.acts .off{opacity:.4;pointer-events:none}
.kbox{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--bg)}
.kbox .ks{flex:0 0 40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff}
.kbox .kt{font-size:12.5px;color:var(--sub)}
.kbox .kn{font-size:15.5px;font-weight:700;line-height:1.35}
.dl{margin-top:14px}
.dl h4{margin:0 0 6px;font-size:13px;color:var(--sub);font-weight:700}
.hrs{display:grid;grid-template-columns:auto 1fr;gap:3px 16px;font-size:14.5px}
.hrs .t{font-weight:700}
.hrs bdi{unicode-bidi:isolate;direction:ltr;text-align:right}
.acts small{display:block;font-size:11px;font-weight:600;direction:ltr;white-space:nowrap}.acts a span{text-align:center}
.src{font-size:12.5px;color:var(--mut);margin-top:6px}.src .stale{color:var(--soon);font-weight:700}.ksrc{font-size:12.5px;color:var(--sub);margin-top:2px}
.shab{margin:4px 16px 8px;padding:10px 12px;border-radius:10px;background:var(--brandbg);color:var(--brand);font-size:14px;font-weight:600;line-height:1.45}
.warn{font-size:12.5px;color:var(--mut);margin:16px 0 8px;line-height:1.5}

/* ---------- filter dialog ---------- */
.scrim{position:fixed;inset:0;background:rgba(16,24,40,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.dlg{position:fixed;z-index:50;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;padding:8px 18px calc(16px + var(--sb));scroll-padding-bottom:90px;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.dlg.on{transform:none}
.dlg h3{margin:4px 0 0;font-size:19px;font-weight:800}
.fg{margin-top:16px}
.fg h4{margin:0 0 8px;font-size:14px;font-weight:700;color:var(--sub)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{height:42px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.opt.on{background:var(--brand);border-color:var(--brand);color:#fff}
.opt .d{width:9px;height:9px;border-radius:50%}
.sel{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--card);font-size:15.5px}
.fg:last-of-type{margin-bottom:8px}
.dbar{position:sticky;bottom:calc(-16px - var(--sb));display:flex;gap:8px;background:var(--card);padding:14px 0 6px;margin-top:16px}
.dbar .btn{flex:1;height:48px;font-size:15.5px}
.dbar .btn.ghost{flex:0 0 auto;padding:0 20px}

.toast{position:fixed;z-index:60;top:calc(122px + var(--st));left:50%;transform:translate(-50%,-8px);background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;max-width:90%}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- maplibre essentials (full css also loaded) ---------- */
.maplibregl-map{overflow:hidden;position:relative;direction:ltr;font-family:Assistant,sans-serif}
.maplibregl-canvas{position:absolute;left:0;top:0}
.maplibregl-marker{position:absolute;top:0;left:0;will-change:transform}
.maplibregl-ctrl-bottom-right{position:absolute;right:0;bottom:172px;z-index:2}
.attr{position:absolute;right:0;bottom:172px;z-index:2;direction:ltr;font-size:10.5px;background:rgba(255,255,255,.75);padding:1px 6px;border-radius:6px 0 0 0;color:#333}.attr a{color:inherit}@media (min-width:900px){.attr{bottom:0;right:432px}}
@media (min-width:900px){.maplibregl-ctrl-bottom-right{bottom:0;right:432px}}
.mkw{cursor:pointer;position:relative}
.mkw.top{z-index:5}
.mk{width:20px;height:20px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);display:grid;place-items:center;color:#fff;font:800 11px Assistant,sans-serif;line-height:1}
.mk.op{box-shadow:0 0 0 3px #12a15e,0 1px 4px rgba(0,0,0,.35)}
.mk{position:relative}.mk::before{content:"";position:absolute;inset:-12px;border-radius:50%}.mk.sel{width:28px;height:28px;border-width:3px;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.mkl{position:absolute;top:50%;left:calc(100% + 6px);transform:translateY(-50%);background:#fff;padding:2px 7px;border-radius:6px;font:700 12.5px Assistant,sans-serif;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.2);color:#16191f}
.cl{min-width:34px;height:34px;border-radius:17px;background:var(--brand);color:#fff;display:grid;place-items:center;font:700 13.5px Assistant,sans-serif;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.3);padding:0 8px}
.me{width:18px;height:18px;border-radius:50%;background:#2b7cff;border:3px solid #fff;box-shadow:0 0 0 8px rgba(43,124,255,.18),0 1px 4px rgba(0,0,0,.3)}

/* ---------- desktop: side panel ---------- */
@media (min-width:900px){
  .topbar{right:16px;left:auto;width:400px;top:16px}
  .chips{margin:0;padding-inline:0}
  .sheet{right:16px;left:auto;width:400px;top:132px;bottom:16px;height:auto;border-radius:16px;transform:none!important;box-shadow:var(--sh1)}
  .shead{cursor:default}.grab{display:none}
  .fab{left:16px}
  .leaflet-control-container .leaflet-bottom{bottom:0}
  .dlg{left:auto;right:16px;width:400px;bottom:16px;border-radius:16px}
  .toast{top:auto;bottom:24px}
}
@media (prefers-reduced-motion:reduce){.sheet,.dlg,.scrim,.toast{transition:none}}
</style>
</head>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = { get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const HC = { chabad:'חב״ד', eda:'העדה החרדית', landa:'לנדא', products:'מוצרי העדה/לנדא' };
const HCOL = { chabad:'#2456b3', eda:'#5b3a8c', landa:'#8a5a12', products:'#4a6274' };

const KINDS = [['מסעדה','מסעדות ומאפיות'],['אוכל לשבת','אוכל מוכן לשבת'],['קייטרינג','קייטרינג'],['אולם אירועים','אולמות אירועים'],['מלון','בתי מלון'],['בית הארחה','בתי הארחה']];
PLACES.forEach((p, i) => { p.id = i; });

// ---------- icons ----------
const sv = d => `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const FK = '<path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5M9 3v5M17 21V3c-2 1-3 4-3 8h3"/>';
const ICO = {

  'המבורגר וגריל': sv('<path d="M4 11a8 6 0 0 1 16 0z"/><path d="M3 14.5h18"/><path d="M4 18h16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/>'),

  'קפה': sv('<path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M17 11h1.5a2 2 0 0 1 0 4H17"/>'),
  'בייגל': sv('<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.6"/>'),
  'מעדנייה ואוכל מוכן': sv('<path d="M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><path d="M2 10h20"/>'),
  'קייטרינג בשרי': sv('<path d="M3 18h18M5 18a7 7 0 0 1 14 0M12 9V7"/>'),

  'אולם אירועים': sv('<path d="M4 21V10l8-6 8 6v11M9 21v-6h6v6"/>'),
  'בית הארחה לשבת': sv('<path d="M4 21V10l8-6 8 6v11M9 21v-6h6v6"/>'),
  'מלון': sv('<path d="M3 19V6M3 15h18v4M21 15v-3a3 3 0 0 0-3-3h-7v6"/><circle cx="7" cy="11" r="2"/>'),
  'מסעדה': sv(FK), 'אחר': sv(FK)

  let loaded = false;
  map = new maplibregl.Map({ container:'map', style:'https://tiles.openfreemap.org/styles/liberty', center: ME ? [ME.lng, ME.lat] : [34.95, 31.95], zoom: ME ? 14.5 : 7.3, attributionControl:false, pitchWithRotate:false, dragRotate:false });
  map.touchZoomRotate.disableRotation();
  { const a = document.createElement('div'); a.className = 'attr'; a.innerHTML = '<a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> © <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a> © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'; $('map').appendChild(a); }
  map.on('load', () => {
    loaded = true;
    for (const ly of map.getStyle().layers) if (ly.type === 'symbol' && map.getLayoutProperty(ly.id, 'text-field') != null)
      map.setLayoutProperty(ly.id, 'text-field', ['coalesce', ['get', 'name:he'], ['get', 'name']]);

  map.on('moveend', () => mapMode === 'gl' && paint());
  map.on('click', e => { if (e.originalEvent.target.closest && e.originalEvent.target.closest('.mkw')) return; if (!wide() && snapName !== 'peek') snap('peek'); });
  setTimeout(() => { if (!loaded && !document.hidden) fallbackMap(); }, 12000);
}
const mkEl = (html, cls) => { const d = document.createElement('div'); d.className = 'mkw ' + (cls || ''); d.innerHTML = html; return d; };
function paint() {
  if (mapMode === 'svg') return drawSvg();
  if (!map || mapMode !== 'gl') return;
  markers.forEach(m => m.remove()); markers = [];
  if (meMk) { meMk.remove(); meMk = null; }
  if (ME) meMk = new maplibregl.Marker({ element: mkEl('<div class="me"></div>') }).setLngLat([ME.lng, ME.lat]).addTo(map);
  const z = map.getZoom(), b = map.getBounds();
  const list = sel != null && !rows.some(r => r.p.id === sel) ? rows.concat([{ p: PLACES[sel], st: status(PLACES[sel]) }]) : rows;
  if (z < 11.5) {
    const cnt = {}; list.forEach(r => cnt[r.p.c] = (cnt[r.p.c] || 0) + 1);
    for (const c in cnt) { const ll = cityLL(c); if (!ll) continue;
      const el = mkEl(`<div class="cl" title="${esc(c)}">${cnt[c]}</div>`);
      el.onclick = ev => { ev.stopPropagation(); map.easeTo({ center:[ll.lng, ll.lat], zoom:14.5 }); };
      markers.push(new maplibregl.Marker({ element: el }).setLngLat([ll.lng, ll.lat]).addTo(map)); }
    return;
  }
  const seen = {};
  for (const { p, st } of list) {
    const ll = LLof(p); if (!ll) continue;
    if (ll.lng < b.getWest() - .01 || ll.lng > b.getEast() + .01 || ll.lat < b.getSouth() - .01 || ll.lat > b.getNorth() + .01) continue;
    const k = ll.lat.toFixed(4) + ',' + ll.lng.toFixed(4), n = seen[k] = (seen[k] || 0) + 1;
    const ang = n * 2.4, r = n > 1 ? 0.00009 * Math.sqrt(n) : 0;
    const isSel = p.id === sel, big = isSel || z >= 16;
    const op = /[ys]/.test(st.s);
    const el = mkEl(`<div class="mk ${isSel ? 'sel' : ''} ${op ? 'op' : ''}" style="background:${HCOL[p.hc]};${exact(p) ? '' : 'opacity:.55'}">${HL[p.hc]}</div>${big ? `<span class="mkl">${esc(p.n)}</span>` : ''}`, isSel ? 'top' : '');
    el.onclick = ev => { ev.stopPropagation(); detail(p); };

const panTo = ll => { if (map && mapMode === 'gl') map.easeTo({ center:[ll.lng, ll.lat], zoom: Math.max(map.getZoom(), 15.5), offset: wide() ? [-200, 0] : [0, -innerHeight * 0.18] }); };
// fallback when tiles can't load (e.g., inside a sandboxed preview)
let svgVB = null;
function fallbackMap() { mapMode = 'svg'; $('map').hidden = true; $('svgmap').removeAttribute('hidden'); drawSvg(); }
const OUT = [[33.09,35.10],[33.10,35.50],[33.28,35.57],[33.33,35.82],[33.10,35.90],[32.75,35.80],[32.70,35.63],[32.40,35.55],[31.75,35.55],[31.10,35.40],[30.90,35.35],[30.00,35.15],[29.53,34.95],[29.50,34.89],[30.50,34.55],[31.22,34.27],[31.32,34.36],[31.59,34.49],[31.67,34.55],[31.80,34.63],[32.08,34.76],[32.33,34.85],[32.68,34.94],[32.82,34.96],[32.84,35.02],[32.93,35.07],[33.09,35.10]];
const PX = (lat,lng) => [(lng-34.15)*300*Math.cos(rad(31.8)), (33.45-lat)*300];
function drawSvg() {
  const svg = $('svgmap');
  if (!svgVB) { const c = ME ? PX(ME.lat, ME.lng) : PX(32.2, 35.0); const w = 150; svgVB = [c[0]-w/2, c[1]-w*1.1, w, w*2]; }
  svg.setAttribute('viewBox', svgVB.join(' ')); svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  const sc = svgVB[2]/300, cnt = {}; rows.forEach(r => cnt[r.p.c] = (cnt[r.p.c]||0) + 1);
  let g = `<rect x="-999" y="-999" width="3000" height="3000" fill="#e4ebf1"/><polygon points="${OUT.map(([a,b]) => PX(a,b).map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="#f7f7f5" stroke="#d3d9e0" stroke-width="${sc}"/>`;
  for (const c in cnt) { if (!CITY[c]) continue; const [x,y] = PX(...CITY[c]); const r = (7 + Math.sqrt(cnt[c])*1.6)*sc;
    g += `<g data-c="${esc(c)}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${r}" fill="#1d3a6e" stroke="#fff" stroke-width="${2*sc}"/><text x="${x}" y="${y+3.6*sc}" font-size="${10*sc}" fill="#fff" text-anchor="middle" font-weight="700" font-family="Assistant" pointer-events="none">${cnt[c]}</text></g>`; }
  if (ME) { const [x,y] = PX(ME.lat, ME.lng); g += `<circle cx="${x}" cy="${y}" r="${5*sc}" fill="#2b7cff" stroke="#fff" stroke-width="${2*sc}"/>`; }

$('svgmap').addEventListener('click', e => { const t = e.target.closest('[data-c]'); if (!t) return; S.city = t.dataset.c; sel = null; shown = 40; render(); snap('half'); });

// ---------- filter dialog ----------
let lastFocus = null;
function openDlg(html) { lastFocus = document.activeElement; $('dlg').innerHTML = html; $('dlg').classList.add('on'); $('scrim').classList.add('on'); const h = $('dlg').querySelector('h3'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll:true }); } }
function closeDlg() { $('dlg').classList.remove('on'); $('scrim').classList.remove('on'); if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll:true }); }
$('scrim').onclick = closeDlg;
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeDlg(); if (sel != null) { sel = null; render(); } } });
function filters() {
  const foods = [...new Set(PLACES.filter(p => p.k === 'מסעדה').map(p => p.f))].sort((a,b)=>a.localeCompare(b,'he'));
  const cities = Object.keys(CITY).filter(c => PLACES.some(p => p.c === c)).sort((a,b)=>a.localeCompare(b,'he'));
  const o = (on, attr, label) => `<button class="opt${on?' on':''}" ${attr}>${label}</button>`;
  openDlg(`<h3>סינון</h3>
    <div class="fg"><h4>כשרות</h4><div class="opts">${Object.entries(HC).map(([k,v]) => o(S.hc.includes(k), `data-hc="${k}"`, `<span class="d" style="background:${HCOL[k]}"></span>${v}`)).join('')}</div></div>
    <div class="fg"><h4>מה מחפשים</h4><div class="opts">${KINDS.map(([k,v]) => o(S.kind===k, `data-kind="${k}"`, v)).join('')}</div></div>
    ${S.kind === 'מסעדה' ? `<div class="fg"><h4>סוג אוכל</h4><div class="opts">${o(!S.food,'data-food=""','הכל')}${foods.map(f => o(S.food===f, `data-food="${esc(f)}"`, esc(f))).join('')}</div></div>` : ''}
    <div class="fg"><h4>ישוב</h4><select class="sel" id="fCity"><option value="">כל הארץ</option>${cities.map(c => `<option${S.city===c?' selected':''}>${c}</option>`).join('')}</select></div>
    <div class="fg"><h4>מיון</h4><div class="opts">${o(S.sort==='dist','data-sort="dist"','לפי מרחק')}${o(S.sort==='name','data-sort="name"','לפי שם')}</div></div>

    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.hc) { const v = b.dataset.hc; S.hc = S.hc.includes(v) ? S.hc.filter(x=>x!==v) : [...S.hc, v]; }
    else if (b.dataset.kind) { S.kind = b.dataset.kind; if (S.kind !== 'מסעדה') S.food = ''; }
    else if (b.dataset.food != null) S.food = b.dataset.food;

    else if (b.id === 'fOk') { closeDlg(); return; }
    else return;

  };
  $('fCity').onchange = e => { S.city = e.target.value; sel = null; shown = 40; render(); filters(); if (map && S.city && cityLL(S.city)) map.easeTo({ center:[cityLL(S.city).lng, cityLL(S.city).lat], zoom:14 }); };
}
function clearAll() { Object.assign(S, DEF); S.q = ''; S.when = null; $('q').value = ''; sel = null; shown = 40; render(); }

// ---------- planning: "when?" ----------
const dayName = (d, base = IL()) => { const a = new Date(base); a.setHours(0,0,0,0); const b = new Date(d); b.setHours(0,0,0,0); const k = Math.round((b - a) / 864e5); return k === 0 ? 'היום' : k === 1 ? 'מחר' : (d.getDay() === 5 ? 'שישי' : 'יום ' + DAYS[d.getDay()]); };
function whenLabel() { if (!S.when) return ''; const d = new Date(S.when); return dayName(d) + ' ' + hhmm(d.getHours()*60 + d.getMinutes()); }
function nextDay(dow, h, m) { const d = IL(); d.setSeconds(0, 0); const add = (dow - d.getDay() + 7) % 7; d.setDate(d.getDate() + add); d.setHours(h, m); if (d < IL()) d.setDate(d.getDate() + 7); return d; }
function whenDlg() {
  const base = S.when ? new Date(S.when) : IL();
  const days = []; for (let i = 0, d = IL(); days.length < 6; i++) { const x = IL(); x.setDate(d.getDate() + i); if (x.getDay() !== 6) days.push(x); }
  const curDay = new Date(base); curDay.setHours(0,0,0,0);
  const times = []; for (let m = 6*60; m <= 23*60 + 30; m += 30) times.push(m);
  const bm = base.getHours()*60 + (base.getMinutes() < 30 ? 0 : 30);
  const o = (on, attr, label) => `<button class="opt${on?' on':''}" ${attr}>${label}</button>`;
  openDlg(`<h3 tabindex="-1">מתי רוצים להגיע?</h3>
    <div class="fg"><h4>מהיר</h4><div class="opts">${o(!S.when,'data-now="1"','עכשיו')}${o(false,'data-pre="5,9,0"','שישי בבוקר 09:00')}${o(false,'data-pre="5,12,0"','שישי בצהריים 12:00')}${o(false,'data-pre="today,19,0"','היום בערב 19:00')}</div></div>
    <div class="fg"><h4>יום</h4><div class="opts">${days.map(d => { const k = new Date(d); k.setHours(0,0,0,0); return o(S.when && +k === +curDay, `data-day="${+k}"`, dayName(d)); }).join('')}</div></div>
    <div class="fg"><h4>שעה</h4><select class="sel" id="wTime">${times.map(m => `<option value="${m}"${m === bm ? ' selected' : ''}>${hhmm(m)}</option>`).join('')}</select></div>
    <div class="dbar"><button class="btn ghost" id="wNow">עכשיו</button><button class="btn pri" id="wOk">הצגה</button></div>`);
  let day = +curDay;
  const apply = () => { const m = +$('wTime').value; const d = new Date(day); d.setHours(Math.floor(m/60), m % 60, 0, 0); S.when = +d; };
  $('dlg').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;

    if (b.dataset.pre) { const [dw, h, m] = b.dataset.pre.split(','); let d; if (dw === 'today') { d = IL(); d.setHours(+h, +m, 0, 0); } else d = nextDay(+dw, +h, +m); S.when = +d; S.open = true; closeDlg(); sel = null; shown = 40; render(); return; }

function fridayBanner(now) {
  const dw = now.getDay(); if (dw !== 4 && dw !== 5) return '';

  if (dw === 5 && hhmm(now.getHours()*60 + now.getMinutes()) >= t) return '';
  const dn = dayName(f); return `<div class="shab">הדלקת נרות ב${esc(city)} ${dn === 'היום' || dn === 'מחר' ? dn : 'ביום שישי'}: ${t} (מנהג חב״ד)</div>`;
}
function cityDlg() {
  const cities = Object.keys(CITY).filter(c => PLACES.some(p => p.c === c)).sort((a,b) => a.localeCompare(b,'he'));
  openDlg(`<h3 tabindex="-1">באיזה ישוב?</h3><div class="fg"><select class="sel" id="cSel"><option value="">בחירה…</option>${cities.map(c => `<option>${c}</option>`).join('')}</select></div><div class="dbar"><button class="btn pri" id="cOk">הצגה</button></div>`);

}

// ---------- GPS ----------
function gps() {
  if (!navigator.geolocation) return toast('איתור מיקום לא נתמך במכשיר הזה');
  toast('מאתר מיקום…');
  navigator.geolocation.getCurrentPosition(pos => {
    ME = { lat: pos.coords.latitude, lng: pos.coords.longitude, src:'gps' }; ME.label = nearestCity(ME); 
    sel = null; shown = 40; render(); if (map) map.easeTo({ center:[ME.lng, ME.lat], zoom:15 }); else { svgVB = null; drawSvg(); }
    toast('מוצגים המקומות הקרובים אליך');
  }, err => toast(err.code === 1 ? 'אין הרשאת מיקום. אפשר לבחור ישוב בסינון' : 'לא הצלחנו לאתר מיקום'), { enableHighAccuracy:true, timeout:10000, maximumAge:60000 });
}
