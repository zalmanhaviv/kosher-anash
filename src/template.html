<style>
:root{
  --ink:#16191f;--sub:#5b6270;--mut:#6b7280;--line:#e8eaee;--bg:#f3f4f6;--card:#fff;
  --brand:#1d3a6e;--brandbg:#eef2f9;--open:#0e7c47;--closed:#c0392b;
  --chabad:#2456b3;--eda:#5b3a8c;--landa:#8a5a12;--products:#4a6274;--soon:#b45309;
  --sh1:0 1px 2px rgba(16,24,40,.06),0 2px 8px rgba(16,24,40,.08);
  --sh2:0 -2px 18px rgba(16,24,40,.14);
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
  --on:#fff;--grab:#d6d9de;--hover:#eef0f2;--subtle:#fafbfc;--notebg:#fff8e6;--notefg:#7a4b00;--ring:#7ee2ad;--ringstrong:#12a15e;--me:#2b7cff;
  /* type scale (Assistant): 11 / 12.5 / 14 / 15.5 / 16 (inputs, avoids iOS zoom) / 18 / 22 */
  --fs-xs:11px;--fs-sm:12.5px;--fs-md:14px;--fs-base:15.5px;--fs-input:16px;--fs-lg:18px;--fs-xl:22px;
  /* spacing 4-based, radii, motion */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;
  --r-xs:6px;--r-sm:10px;--r-md:12px;--r-lg:16px;--r-pill:999px;
  --dur-fast:150ms;--dur:200ms;--dur-sheet:250ms;--ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Assistant,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:var(--fs-input);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- map ---------- */
#map{position:fixed;inset:0;z-index:0;background:var(--hover)}
#svgmap{position:fixed;inset:0;width:100%;height:100%;z-index:0;background:var(--hover)}

/* ---------- top bar ---------- */
.topbar{position:fixed;top:calc(10px + var(--st));right:12px;left:12px;z-index:30;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.topbar>*{pointer-events:auto}
.sbar{display:flex;align-items:center;gap:4px;height:52px;background:var(--card);border-radius:var(--r-md);box-shadow:var(--sh1);padding:0 6px 0 8px}
.brandmark{margin:0;flex:0 0 auto;font-weight:800;font-size:var(--fs-input);color:var(--brand);padding:0 8px 0 4px;letter-spacing:-.2px;white-space:nowrap}
.sbar .sep{width:1px;height:24px;background:var(--line)}
.sbar input{flex:1;min-width:0;border:0;outline:0;background:transparent;height:100%;font-size:var(--fs-input);padding:0 8px}
.sbar input::placeholder{color:var(--mut)}
.ibtn{flex:0 0 44px;height:44px;border:0;background:transparent;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--sub);position:relative}
.ibtn:hover{background:var(--bg)}
.ibtn .badge{position:absolute;top:5px;left:5px;min-width:16px;height:16px;border-radius:var(--r-sm);background:var(--brand);color:var(--on);font-size:var(--fs-xs);font-weight:700;display:none;place-items:center;padding:0 4px}
.ibtn .badge.on{display:grid}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;margin:0 -12px;padding-inline:12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:38px;padding:0 13px;border-radius:var(--r-pill);border:0;background:var(--card);box-shadow:var(--sh1);font-size:var(--fs-md);font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--brand);color:var(--on)}
.chip .d{width:8px;height:8px;border-radius:50%;background:var(--open)}
.chip.on .d{background:var(--ring)}

/* ---------- floating map buttons ---------- */
.fab{position:fixed;z-index:20;left:12px;width:44px;height:44px;border-radius:var(--r-md);border:0;background:var(--card);box-shadow:var(--sh1);display:grid;place-items:center;color:var(--brand);transition:bottom var(--dur-sheet) var(--ease)}

/* ---------- sheet ---------- */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:25;height:calc(100% - 64px - var(--st));background:var(--card);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:var(--sh2);display:flex;flex-direction:column;transform:translateY(calc(100% - 168px));transition:transform var(--dur-sheet) var(--ease);will-change:transform;touch-action:none}
.sheet.drag{transition:none}
.shead{flex:0 0 auto;padding:8px 16px 10px;cursor:grab}
.grab{width:36px;height:5px;border-radius:3px;background:var(--grab);margin:0 auto 10px}
.stitle{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.stitle h2{margin:0;font-size:var(--fs-lg);font-weight:700}
.stitle span{font-size:var(--fs-md);color:var(--sub)}
.sbody{flex:1;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding-bottom:calc(16px + var(--sb))}
.sec-h{font-size:var(--fs-sm);font-weight:700;color:var(--sub);padding:14px 16px 6px}
.item{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:right;border:0;background:transparent;padding:12px 16px;border-top:1px solid var(--line)}
.item:hover{background:var(--subtle)}
.item .pinx{flex:0 0 36px;height:36px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--on);margin-top:2px;position:relative}
.pinx i{position:absolute;bottom:-4px;left:-4px;min-width:16px;height:16px;border-radius:var(--r-sm);background:var(--card);color:var(--ink);font:800 var(--fs-xs)/16px Assistant,sans-serif;font-style:normal;text-align:center;box-shadow:0 0 0 1px var(--line)}
.item .bd{flex:1;min-width:0}
.item .nm{font-size:var(--fs-input);font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .l2{font-size:var(--fs-md);color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .l3{display:flex;flex-wrap:wrap;column-gap:10px;row-gap:2px;font-size:var(--fs-md);margin-top:3px;align-items:center}
.item .kh{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .ds{flex:0 0 auto;font-size:var(--fs-md);font-weight:600;color:var(--ink);text-align:left;margin-top:3px}
.st-y{color:var(--open);font-weight:700}.st-n{color:var(--closed);font-weight:600}.st-u{color:var(--sub);font-weight:600}.st-s{color:var(--soon);font-weight:700}.st-x{color:var(--closed);font-weight:700;text-decoration:line-through}
.k-chabad{color:var(--chabad)}.k-eda{color:var(--eda)}.k-landa{color:var(--landa)}.k-products{color:var(--products)}
.b-chabad{background:var(--chabad)}.b-eda{background:var(--eda)}.b-landa{background:var(--landa)}.b-products{background:var(--products)}
.more{display:block;margin:12px auto;height:44px;padding:0 18px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);font-weight:600;color:var(--sub)}
.empty{padding:40px 24px;text-align:center;color:var(--sub);line-height:1.5}
.empty b{display:block;color:var(--ink);font-size:var(--fs-input);margin-bottom:4px}
.cta{display:flex;gap:12px;align-items:center;margin:4px 16px 8px;padding:12px 14px;border-radius:var(--r-md);background:var(--brandbg)}
.cta p{margin:0;flex:1;font-size:var(--fs-md);color:var(--sub);line-height:1.4}
.cta p b{display:block;color:var(--ink);font-size:var(--fs-base)}
.btn{height:44px;padding:0 14px;border-radius:var(--r-sm);border:0;font-weight:700;white-space:nowrap}
.btn.pri{background:var(--brand);color:var(--on)}
.btn.ghost{background:var(--bg);color:var(--ink)}
.note{margin:4px 16px 8px;padding:10px 12px;border-radius:var(--r-sm);background:var(--notebg);color:var(--notefg);font-size:var(--fs-md);line-height:1.45}
.foot{padding:18px 16px 4px;font-size:var(--fs-sm);color:var(--mut);line-height:1.6}
.foot a{color:var(--sub);display:inline-block;padding:var(--s3) 0}
.sbar:focus-within{box-shadow:0 0 0 2px var(--brand),var(--sh1)}
.det .hd{display:flex;align-items:flex-start;gap:var(--s2)}.det .hd h3{flex:1}
.fav{flex:0 0 44px;height:44px;border:0;background:transparent;color:var(--landa);display:grid;place-items:center;border-radius:var(--r-sm)}
.recent{display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none;padding:0 var(--s4) var(--s2)}.recent button{flex:0 0 auto;min-height:44px;padding:0 var(--s3);border:1px solid var(--line);border-radius:var(--r-pill);background:var(--card);font-weight:600;font-size:var(--fs-md);color:var(--ink)}
.offl{padding:6px var(--s3);border-radius:var(--r-md);background:var(--notebg);color:var(--notefg);font-size:var(--fs-sm);font-weight:700;text-align:center;box-shadow:var(--sh1)}.offl[hidden]{display:none}
.instc{margin:var(--s1) var(--s4) var(--s2);padding:var(--s3) var(--s4);border-radius:var(--r-md);background:var(--brandbg);display:flex;gap:var(--s3);align-items:center}.instc p{flex:1;margin:0;font-size:var(--fs-md)}

/* ---------- place detail ---------- */
.det{padding:0 16px}
.det .back{display:flex;align-items:center;gap:4px;border:0;background:transparent;color:var(--sub);font-weight:600;padding:0;height:44px;margin-bottom:0}
.det h3{margin:0;font-size:var(--fs-xl);font-weight:800;line-height:1.25}
.det .addr{color:var(--sub);font-size:var(--fs-base);margin-top:2px}
.det .row{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:var(--fs-md);align-items:center}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.acts a,.acts button{height:58px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--brand);text-decoration:none;font-size:var(--fs-sm);font-weight:700}
.acts a.pri{background:var(--brand);border-color:var(--brand);color:var(--on)}
.acts .off{opacity:.4;pointer-events:none}
.kbox{display:flex;gap:12px;align-items:center;padding:12px;border-radius:var(--r-md);background:var(--bg)}
.kbox .ks{flex:0 0 40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--on)}
.kbox .kt{font-size:var(--fs-sm);color:var(--sub)}
.kbox .kn{font-size:var(--fs-base);font-weight:700;line-height:1.35}
.dl{margin-top:14px}
.dl h4{margin:0 0 6px;font-size:var(--fs-sm);color:var(--sub);font-weight:700}
.hrs{display:grid;grid-template-columns:auto 1fr;gap:3px 16px;font-size:var(--fs-md)}
.hrs .t{font-weight:700}
.hrs bdi{unicode-bidi:isolate;direction:ltr;text-align:right}
.acts small{display:block;font-size:var(--fs-xs);font-weight:600;direction:ltr;white-space:nowrap}.acts a span{text-align:center}
.src{font-size:var(--fs-sm);color:var(--mut);margin-top:6px}.src .stale{color:var(--soon);font-weight:700}.ksrc{font-size:var(--fs-sm);color:var(--sub);margin-top:2px}
.shab{margin:4px 16px 8px;padding:10px 12px;border-radius:var(--r-sm);background:var(--brandbg);color:var(--brand);font-size:var(--fs-md);font-weight:600;line-height:1.45}
.warn{font-size:var(--fs-sm);color:var(--mut);margin:16px 0 8px;line-height:1.5}

/* ---------- filter dialog ---------- */
.scrim{position:fixed;inset:0;background:rgba(16,24,40,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity var(--dur)}
.scrim.on{opacity:1;pointer-events:auto}
.dlg{position:fixed;z-index:50;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--card);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:8px 18px calc(16px + var(--sb));scroll-padding-bottom:90px;transform:translateY(105%);transition:transform var(--dur-sheet) var(--ease)}
.dlg.on{transform:none}
.dlg h3{margin:4px 0 0;font-size:var(--fs-lg);font-weight:800}
.fg{margin-top:16px}
.fg h4{margin:0 0 8px;font-size:var(--fs-md);font-weight:700;color:var(--sub)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{height:42px;padding:0 13px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--card);font-size:var(--fs-md);font-weight:600;display:flex;align-items:center;gap:7px}
.opt.on{background:var(--brand);border-color:var(--brand);color:var(--on)}
.opt .d{width:9px;height:9px;border-radius:50%}
.sel{width:100%;height:44px;border:1px solid var(--line);border-radius:var(--r-sm);padding:0 10px;background:var(--card);font-size:var(--fs-base)}
.fg:last-of-type{margin-bottom:8px}
.dbar{position:sticky;bottom:calc(-16px - var(--sb));display:flex;gap:8px;background:var(--card);padding:14px 0 6px;margin-top:16px}
.dbar .btn{flex:1;height:48px;font-size:var(--fs-base)}
.dbar .btn.ghost{flex:0 0 auto;padding:0 20px}

.toast{position:fixed;z-index:60;top:calc(122px + var(--st));left:50%;transform:translate(-50%,-8px);background:var(--ink);color:var(--on);padding:10px 14px;border-radius:var(--r-sm);font-size:var(--fs-md);opacity:0;transition:var(--dur);pointer-events:none;max-width:90%}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- maplibre essentials (full css also loaded) ---------- */
.maplibregl-map{overflow:hidden;position:relative;direction:ltr;font-family:Assistant,sans-serif}
.maplibregl-canvas{position:absolute;left:0;top:0}
.maplibregl-marker{position:absolute;top:0;left:0;will-change:transform}
.maplibregl-ctrl-bottom-right{position:absolute;right:0;bottom:172px;z-index:2}
.attr{position:absolute;right:0;bottom:172px;z-index:2;direction:ltr;font-size:var(--fs-xs);background:rgba(255,255,255,.75);padding:1px 6px;border-radius:var(--r-xs) 0 0 0;color:var(--ink)}.attr a{color:inherit}@media (min-width:900px){.attr{bottom:0;right:432px}}
@media (min-width:900px){.maplibregl-ctrl-bottom-right{bottom:0;right:432px}}
.mkw{cursor:pointer;position:relative}
.mkw.top{z-index:5}
.mk{width:20px;height:20px;border-radius:50%;border:2px solid var(--card);box-shadow:0 1px 4px rgba(0,0,0,.35);display:grid;place-items:center;color:var(--on);font:800 var(--fs-xs) Assistant,sans-serif;line-height:1}
.mk.op{box-shadow:0 0 0 3px var(--ringstrong),0 1px 4px rgba(0,0,0,.35)}
.mk{position:relative}.mk::before{content:"";position:absolute;inset:-12px;border-radius:50%}.mk.ap{background:var(--card)!important;border:2px dashed currentColor}.mk.sel{width:28px;height:28px;border-width:3px;font-size:var(--fs-sm);box-shadow:0 2px 10px rgba(0,0,0,.4)}
.mkl{position:absolute;top:50%;left:calc(100% + 6px);transform:translateY(-50%);background:var(--card);padding:2px 7px;border-radius:var(--r-xs);font:700 var(--fs-sm) Assistant,sans-serif;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.2);color:var(--ink)}
.cl{min-width:34px;height:34px;border-radius:17px;background:var(--brand);color:var(--on);display:grid;place-items:center;font:700 var(--fs-md) Assistant,sans-serif;border:3px solid var(--card);box-shadow:0 1px 6px rgba(0,0,0,.3);padding:0 8px}
.me{width:18px;height:18px;border-radius:50%;background:var(--me);border:3px solid var(--card);box-shadow:0 0 0 8px rgba(43,124,255,.18),0 1px 4px rgba(0,0,0,.3)}

/* ---------- desktop: side panel ---------- */
@media (min-width:900px){
  .topbar{right:16px;left:auto;width:400px;top:16px}
  .chips{margin:0;padding-inline:0}
  .sheet{right:16px;left:auto;width:400px;top:132px;bottom:16px;height:auto;border-radius:var(--r-lg);transform:none!important;box-shadow:var(--sh1)}
  .shead{cursor:default}.grab{display:none}
  .fab{left:16px}
  .leaflet-control-container .leaflet-bottom{bottom:0}
  .dlg{left:auto;right:16px;width:400px;bottom:16px;border-radius:var(--r-lg)}
  .toast{top:auto;bottom:24px}
}
@media (prefers-reduced-motion:reduce){.sheet,.dlg,.scrim,.toast{transition:none}}

@media (max-width:330px){.brandmark,.sbar .sep{display:none}.cta{flex-direction:column;align-items:stretch}.cta .btn{white-space:normal;height:auto;min-height:44px}.acts{grid-template-columns:repeat(2,1fr)}}
.report-slot{display:none} /* reserved: "report a mistake" button, deferred by decision */
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.chip,.item,.opt,.btn{transition:none}}
</style>
</head>

    sel = null; shown = 40; render(); if (map) ease({ center:[ME.lng, ME.lat], zoom:15 }); else { svgVB = null; drawSvg(); }
    toast('מוצגים המקומות הקרובים אליך');
  }, err => toast(err.code === 1 ? 'אין הרשאת מיקום. אפשר לבחור ישוב בסינון' : 'לא הצלחנו לאתר מיקום'), { enableHighAccuracy:true, timeout:10000, maximumAge:60000 });
}

// ---------- misc ----------
let tt; function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2300); }
let qt; $('q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value; sel = null; shown = 40; render(); if (S.q && snapName === 'peek') snap('half'); }, 140); });
$('cOpen').onclick = () => { S.open = !S.open; if (S.open) S.fri = false; sel = null; shown = 40; render(); };
$('cFri').onclick = () => { S.fri = !S.fri; if (S.fri) { S.open = false; S.when = null; } sel = null; shown = 40; render(); };
document.querySelectorAll('.chip[data-t]').forEach(b => b.onclick = () => { const v = b.dataset.t; S.t = S.t.includes(v) ? S.t.filter(x=>x!==v) : [...S.t, v]; sel = null; shown = 40; render(); });
document.querySelectorAll('.chip[data-f]').forEach(b => b.onclick = () => { S.food = S.food === b.dataset.f ? '' : b.dataset.f; S.kind = 'מסעדה'; sel = null; shown = 40; render(); });
$('fBtn').onclick = filters;
$('cWhen').onclick = whenDlg;
$('meBtn').onclick = () => ME && map ? ease({ center:[ME.lng, ME.lat], zoom:15 }) : gps();
$('sbody').addEventListener('click', e => { const it = e.target.closest('.item'); if (it) return detail(PLACES[+it.dataset.id]); const rc = e.target.closest('[data-rec]'); if (rc) { const p = byU(rc.dataset.rec); if (p) detail(p); } });
addEventListener('resize', () => { snap(snapName); map && map.resize(); });
setInterval(() => document.visibilityState === 'visible' && sel == null && render(), 60000);

addEventListener('beforeinstallprompt', e => { e.preventDefault(); INST = e; render(); });
addEventListener('appinstalled', () => { INST = null; render(); toast('נוסף למסך הבית'); });
$('sbody').addEventListener('click', async e => { if (!e.target.closest('#inst')) return; if (INST) { INST.prompt(); try { await INST.userChoice; } catch {} INST = null; render(); } else toast('בספארי: כפתור השיתוף ואז "הוספה למסך הבית"'); });
function netBar() { const off = navigator.onLine === false; $('offl').hidden = !off; if (off) $('offl').textContent = 'אין חיבור. מוצג המידע השמור מ־' + fmtDate(DATA_UPDATED) + '. במפה רק אזורים שכבר נצפו.'; }
addEventListener('offline', netBar); addEventListener('online', netBar); netBar();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/sw.js').catch(() => {});

// ---------- live data from GitHub: a data change needs no new upload to Netlify ----------
// The built-in copy shows instantly (and offline); a newer copy from the repository replaces it when it arrives.
const RAW = 'https://raw.githubusercontent.com/zalmanhaviv/kosher-anash/main/data/';
const okPlace = p => p && typeof p.n === 'string' && p.n && typeof p.h === 'string' && p.h && HC[p.hc] && Array.isArray(p.t) && typeof p.c === 'string';
Promise.all(['places.json', 'meta.json'].map(f => fetch(RAW + f, { cache: 'no-cache' }).then(r => r.ok ? r.json() : null)))
  .then(([a, meta]) => {
    // rev goes up with every data change, so a same-day update is picked up too
    if (!Array.isArray(a) || a.length < 100 || !a.every(okPlace) || !meta || !meta.updated || (meta.rev | 0) <= DATA_REV) return;
    const cur = sel != null ? PLACES[sel] : null;
    PLACES.length = 0;
    a.forEach((p, i) => { p.id = i; p.hay = norm([p.n,p.s,p.c,p.h,p.f,p.tt,HC[p.hc]].join(' ')); PLACES.push(p); });
    DATA_UPDATED = meta.updated; DATA_REV = meta.rev | 0;
    if (cur) { const m = PLACES.find(p => p.n === cur.n && p.s === cur.s && p.c === cur.c && p.k === cur.k); sel = m ? m.id : null; }
    shown = 40; render();
  }).catch(() => {});

// links: ?p=<id> opens a place (shared links); ?open=1 and ?near=1 come from the home-screen shortcuts
const QS = new URLSearchParams(location.search);
if (QS.get('open') === '1') S.open = true;
render(); snap('peek'); initMap();
{ const p = QS.get('p') && byU(QS.get('p')); if (p) { detail(p); snap('half'); const ll = LLof(p); if (ll) setTimeout(() => panTo(ll), 600); } }
if (QS.get('near') === '1') gps();
if (QS.toString()) history.replaceState(null, '', location.pathname);
if (navigator.permissions) navigator.permissions.query({ name:'geolocation' }).then(r => { if (r.state === 'granted') gps(); }).catch(() => {});
})();
</script>
</body>
