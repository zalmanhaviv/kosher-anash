/* Design system S1-7 – hybrid direction (Wolt base + Apple cleanliness), approved by the owner 26.11.
   Every colour, size, space, radius, shadow and duration is a token here; rules below use tokens only.
   Tekhelet (--brand) is for actions and the active state only. Contrast >= 4.5:1: scripts/contrast.py (CI). */
@font-face{font-family:"Rubik";src:url(/fonts/rubik.woff2) format("woff2");font-weight:400 600;font-style:normal;font-display:swap}
:root{
  color-scheme:light dark;
  /* type: Rubik, text 400/500, headings 600 */
  --font:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --fw-text:400;--fw-med:500;--fw-head:600;
  --fs-xs:12px;--fs-sm:13px;--fs-md:14.5px;--fs-base:15px;--fs-input:16px;--fs-lg:18px;--fs-xl:24px;--fs-title2:22px;--fs-2xl:27px;--fs-mk:14px;--fs-mk-sel:19px;
  --lh:1.45;--lh-tight:1.2;--ls-title:-.005em;
  /* spacing (4px scale) */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s7:32px;--s8:40px;
  /* sizes: tap targets >= 44px */
  --tap:44px;--search-h:50px;--chip-h:44px;--btn-h:48px;--fab:48px;--act-h:58px;--kb:40px;--kb-big:48px;--kb-mini:20px;--act-pri-h:52px;--row-h:80px;--pad-card:14px;--peek:168px;--sheet-gap:64px;--desk-top:140px;--desk-attr:432px;--toast-top:128px;
  --mk:28px;--mk-sel:40px;--mk-dot:10px;--cl:36px;--grab-w:38px;--grab-h:5px;--panel-w:400px;
  /* radii */
  --r-xs:8px;--r-sm:12px;--r-md:14px;--r-lg:16px;--r-xl:22px;--r-pill:999px;
  /* motion: restrained */
  --dur-fast:120ms;--dur:200ms;--dur-sheet:250ms;--ease:cubic-bezier(.2,.8,.2,1);--press:.98;
  --blur:blur(20px) saturate(1.7);
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);

  /* colour by role – light */
  --bg:#F6F7F9;--surface:#FFFFFF;--surface-hover:#FAFBFC;--ink:#16191E;--sub:#5B626C;--line:rgba(20,30,45,.08);--line-strong:#B3BAC4;--hover:rgba(20,30,45,.04);
  --brand:#0F5EA3;--on-brand:#FFFFFF;--brand-tint:#E6F0F9;--focus:#0F5EA3;
  --open:#11703A;--open-bg:#E5F2EA;--soon:#A24E00;--soon-bg:#FBEEDF;--closed:#B3261E;--closed-bg:#FBE9E7;
  --warn-ink:#704300;--warn-bg:#FFF3D6;
  /* kashrut groups (letter + colour + text); names are read by the script (HCOL) */
  --chabad:#24407A;--eda:#8C2D45;--landa:#6B5414;--products:#4B5563;--on-k:#FFFFFF;
  /* glass over the map (solid fallback below when backdrop-filter is missing) */
  --glass:rgba(255,255,255,.80);--glass-chip:rgba(255,255,255,.86);--glass-float:rgba(255,255,255,.90);--glass-solid:#FFFFFF;
  --grabber:#C9CDD3;--scrim:rgba(10,14,20,.38);--toast-bg:rgba(22,25,30,.92);--toast-ink:#FFFFFF;
  --map-bg:#F5F4F0;--map-halo:#F8F7F3;--pin-ring:#FFFFFF;--me:#2B7CFF;--me-halo:rgba(43,124,255,.18);--attr-bg:rgba(255,255,255,.75);
  /* shadows: very soft */
  --sh-card:0 1px 2px rgba(20,30,45,.04),0 2px 10px rgba(20,30,45,.05);
  --sh-float:0 2px 12px rgba(20,30,45,.14);--sh-search:0 2px 14px rgba(20,30,45,.10);--sh-chip:0 1px 6px rgba(20,30,45,.10);
  --sh-sheet:0 -6px 28px rgba(20,30,45,.09);--sh-mk:0 1px 4px rgba(20,30,45,.25);--sh-mk-sel:0 3px 8px rgba(20,30,45,.30);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1114;--surface:#1B1E23;--surface-hover:#22262C;--ink:#F1F3F6;--sub:#A3AAB4;--line:rgba(255,255,255,.08);--line-strong:#5A626D;--hover:rgba(255,255,255,.05);
  --brand:#5BA6E8;--on-brand:#07182A;--brand-tint:#16293C;--focus:#7DBBF0;
  --open:#62D394;--open-bg:#173A27;--soon:#F6AE5E;--soon-bg:#3B2A14;--closed:#FF8F85;--closed-bg:#3F1D1B;
  --warn-ink:#F6D184;--warn-bg:#3A2E12;
  --chabad:#A9C1F2;--eda:#F2A9BA;--landa:#E6C873;--products:#B9C1CC;--on-k:#121418;
  --glass:rgba(36,40,46,.82);--glass-chip:rgba(36,40,46,.88);--glass-float:rgba(36,40,46,.92);--glass-solid:#24282E;
  --grabber:#4A4F57;--scrim:rgba(0,0,0,.55);--toast-bg:rgba(241,243,246,.94);--toast-ink:#16191E;
  --map-bg:#22252A;--map-halo:#1A1C20;--pin-ring:#1B1E23;--me:#5BA6E8;--me-halo:rgba(91,166,232,.22);--attr-bg:rgba(27,30,35,.8);
  --sh-card:none;--sh-float:0 2px 12px rgba(0,0,0,.5);--sh-search:0 2px 14px rgba(0,0,0,.45);--sh-chip:none;

}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:var(--fw-text);font-size:var(--fs-input);line-height:var(--lh);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;transition:transform var(--dur-fast),background-color var(--dur),color var(--dur)}
button:active{transform:scale(var(--press))}
:focus{outline:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
/* the script still names the old font inline (kashrut letter, svg map) – Rubik wins */
[style*="Assistant"],text{font-family:var(--font)!important}

/* ---------- map ---------- */
#map{position:fixed;inset:0;z-index:0;background:var(--map-bg)}
#svgmap{position:fixed;inset:0;width:100%;height:100%;z-index:0;background:var(--map-bg)}

/* ---------- top bar: translucent search + chips over the map ---------- */
.topbar{position:fixed;top:calc(var(--s3) + var(--st));right:var(--s3);left:var(--s3);z-index:30;display:flex;flex-direction:column;gap:var(--s2);pointer-events:none}
.topbar>*{pointer-events:auto}
.sbar{display:flex;align-items:center;gap:var(--s1);height:var(--search-h);background:var(--glass);border-radius:var(--r-lg);box-shadow:var(--sh-search);padding:0 var(--s1) 0 var(--s3);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.brandmark{margin:0;flex:0 0 auto;font-weight:var(--fw-head);font-size:var(--fs-input);color:var(--ink);padding:0 var(--s1);letter-spacing:var(--ls-title);white-space:nowrap}
.sbar .sep{width:1px;height:var(--s6);background:var(--line)}
.sbar input{flex:1;min-width:0;border:0;outline:0;background:transparent;height:100%;font-size:var(--fs-input);padding:0 var(--s2);color:var(--ink)}
.sbar input::placeholder{color:var(--sub);opacity:1}
.sbar:focus-within{box-shadow:0 0 0 2px var(--focus),var(--sh-search)}
.ibtn{flex:0 0 var(--tap);height:var(--tap);border:0;background:transparent;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--sub);position:relative}
.ibtn:hover{background:var(--hover)}
.ibtn .badge{position:absolute;top:var(--s1);left:var(--s1);min-width:18px;height:18px;border-radius:var(--r-pill);background:var(--brand);color:var(--on-brand);font-size:var(--fs-xs);font-weight:var(--fw-head);display:none;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums}
.ibtn .badge.on{display:grid}
.chips{display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none;padding:2px var(--s3) var(--s1);margin:0 calc(-1 * var(--s3))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:var(--chip-h);padding:0 var(--s4);border-radius:var(--r-xl);border:0;background:var(--glass-chip);box-shadow:var(--sh-chip);font-size:var(--fs-md);font-weight:var(--fw-med);color:var(--ink);display:flex;align-items:center;gap:6px;white-space:nowrap;font-variant-numeric:tabular-nums;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.chip.on{background:var(--brand);color:var(--on-brand)}
.chip .d{width:var(--s2);height:var(--s2);border-radius:50%;background:var(--open)}
.chip.on .d{background:currentColor}
.offl{padding:var(--s2) var(--s3);border-radius:var(--r-sm);background:var(--warn-bg);color:var(--warn-ink);font-size:var(--fs-sm);font-weight:var(--fw-med);text-align:center;box-shadow:var(--sh-float)}

/* ---------- floating map button ---------- */
.fab{position:fixed;z-index:20;left:var(--s3);width:var(--fab);height:var(--fab);border-radius:50%;border:0;background:var(--glass-float);box-shadow:var(--sh-float);display:grid;place-items:center;color:var(--brand);transition:bottom var(--dur-sheet) var(--ease);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.sbar,.chip:not(.on),.fab{background:var(--glass-solid)}}

/* ---------- sheet ---------- */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:25;height:calc(100% - var(--sheet-gap) - var(--st));background:var(--bg);border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--sh-sheet);display:flex;flex-direction:column;transform:translateY(calc(100% - var(--peek)));transition:transform var(--dur-sheet) var(--ease);will-change:transform;touch-action:none}
.sheet.drag{transition:none}
.shead{flex:0 0 auto;padding:var(--s2) var(--s4) var(--s2);cursor:grab}
.grab{width:var(--grab-w);height:var(--grab-h);border-radius:3px;background:var(--grabber);margin:0 auto var(--s3)}
.stitle{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3)}
.stitle h2{margin:0;font-size:var(--fs-xl);font-weight:var(--fw-head);line-height:var(--lh-tight);letter-spacing:var(--ls-title)}
.stitle span{font-size:var(--fs-sm);color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.sbody{flex:1;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:0 var(--s4) calc(var(--s4) + var(--sb))}
.sec-h{font-size:var(--fs-lg);font-weight:var(--fw-head);color:var(--ink);padding:var(--s4) 2px var(--s2)}

/* place row: white rounded card, no lines, ~80px: name / address / kashrut · status label */
.item{display:flex;gap:var(--s3);align-items:center;width:100%;min-height:var(--row-h);text-align:right;border:0;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-card);padding:10px var(--pad-card);margin-bottom:var(--s2);color:var(--ink)}
.item:hover{background:var(--surface-hover)}
/* kashrut badge: the letter is the badge, the food icon a small white tag on it */
.item .pinx{flex:0 0 var(--kb);height:var(--kb);border-radius:50%;display:grid;place-items:center;color:var(--on-k);position:relative;align-self:center}
.pinx svg{position:absolute;bottom:-3px;left:-5px;width:var(--kb-mini);height:var(--kb-mini);padding:3px;border-radius:50%;background:var(--surface);color:var(--sub);box-shadow:var(--sh-mk);stroke-width:2.2}
.pinx i{font:var(--fw-head) var(--fs-lg)/1 var(--font);font-style:normal}
.item .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.item .nm{font-size:var(--fs-input);font-weight:var(--fw-med);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .l2{font-size:var(--fs-sm);color:var(--sub);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .l3{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s2);font-size:var(--fs-sm);margin-top:3px;align-items:center;color:var(--sub)}
.item .kh{font-weight:var(--fw-med);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.item .l3 [class^="st-"]{display:inline-block;padding:1px var(--s2);border-radius:var(--r-xs);font-weight:var(--fw-med)}
.item .ds{flex:0 0 auto;align-self:flex-start;font-size:var(--fs-sm);font-weight:var(--fw-med);color:var(--sub);text-align:left;margin-top:2px;font-variant-numeric:tabular-nums}
.item .src{color:var(--warn-ink);font-weight:var(--fw-med);margin-top:3px}
/* status: text colour + quiet label background */
.st-y{color:var(--open);background:var(--open-bg)}.st-s{color:var(--soon);background:var(--soon-bg)}.st-n{color:var(--closed);background:var(--closed-bg)}
.st-u{color:var(--sub);font-weight:var(--fw-med)}.st-x{color:var(--closed);background:var(--closed-bg);text-decoration:line-through}
[class^="st-"]{font-variant-numeric:tabular-nums}
.k-chabad{color:var(--chabad)}.k-eda{color:var(--eda)}.k-landa{color:var(--landa)}.k-products{color:var(--products)}
.b-chabad{background:var(--chabad)}.b-eda{background:var(--eda)}.b-landa{background:var(--landa)}
.b-products{background:var(--surface);color:var(--products)!important;box-shadow:inset 0 0 0 2px var(--products)}
.more{display:flex;align-items:center;justify-content:center;width:100%;margin:var(--s1) 0 var(--s2);min-height:var(--tap);padding:0 var(--s4);border-radius:var(--r-md);border:0;background:var(--surface);box-shadow:var(--sh-card);font-weight:var(--fw-med);font-size:var(--fs-md);color:var(--brand)}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:var(--s7) var(--s6);text-align:center;color:var(--sub);line-height:1.5}
.empty b{display:block;color:var(--ink);font-size:var(--fs-input);font-weight:var(--fw-med)}
.empty .btn{margin-top:var(--s2)}
/* "what's near you": calm card, quiet tinted town button */
.cta{display:flex;gap:var(--s3);align-items:center;margin:var(--s1) 0 var(--s2);padding:var(--s3) var(--pad-card);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-card)}
.cta p{margin:0;flex:1;font-size:var(--fs-sm);color:var(--sub);line-height:1.45}
.cta p b{display:block;color:var(--ink);font-size:var(--fs-base);font-weight:var(--fw-med)}
.btn{min-height:var(--tap);height:var(--tap);padding:0 var(--s4);border-radius:var(--r-md);border:0;font-weight:var(--fw-med);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--brand);color:var(--on-brand)}
.btn.ghost{background:var(--brand-tint);color:var(--brand)}
.note{margin:var(--s1) 2px var(--s2);color:var(--sub);font-size:var(--fs-sm);line-height:1.5}
.shab{margin:var(--s1) 0 var(--s2);padding:10px var(--s3);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-card);color:var(--ink);font-size:var(--fs-md);font-weight:var(--fw-med);line-height:1.45;font-variant-numeric:tabular-nums}
.instc{margin:var(--s1) 0 var(--s2);padding:var(--s3) var(--pad-card);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-card);display:flex;gap:var(--s2);align-items:center}
.instc p{flex:1;margin:0;font-size:var(--fs-sm);color:var(--sub);line-height:1.45}.instc p b{color:var(--ink);font-weight:var(--fw-med);font-size:var(--fs-base)}
.recent{display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none;padding:0 0 var(--s2);margin:0 calc(-1 * var(--s4));padding-inline:var(--s4)}
.recent::-webkit-scrollbar{display:none}
.recent button{flex:0 0 auto;min-height:var(--tap);padding:0 var(--s4);border:0;border-radius:var(--r-xl);background:var(--surface);box-shadow:var(--sh-card);font-weight:var(--fw-med);font-size:var(--fs-md);color:var(--ink)}
.foot{padding:var(--s5) 2px var(--s1);font-size:var(--fs-xs);color:var(--sub);line-height:1.6}
.foot a{color:var(--brand);display:inline-block;padding:var(--s3) 0}

/* ---------- place card: calm large title, small grey metadata, white groups ---------- */
.det{padding:0}
.det .back{display:inline-flex;align-items:center;gap:var(--s1);border:0;background:transparent;color:var(--brand);font-weight:var(--fw-med);padding:0 var(--s2);margin-inline-start:calc(-1 * var(--s2));height:var(--tap);border-radius:var(--r-md)}
.det .hd{display:flex;align-items:flex-start;gap:var(--s2);margin-top:var(--s2)}
.det h3{flex:1;margin:0;font-size:var(--fs-2xl);font-weight:var(--fw-head);line-height:1.15;letter-spacing:var(--ls-title);text-wrap:balance}
.fav{flex:0 0 var(--tap);height:var(--tap);border:0;background:transparent;color:var(--brand);display:grid;place-items:center;border-radius:50%;margin-top:-6px}
.det .addr{color:var(--sub);font-size:var(--fs-base);margin-top:var(--s1)}
.det .row{display:flex;gap:var(--s1) var(--s3);flex-wrap:wrap;margin-top:var(--s3);font-size:var(--fs-sm);color:var(--sub);align-items:center}
.det .row [class^="st-"]{flex-basis:auto;padding:5px var(--s3);border-radius:10px;font-size:var(--fs-base);font-weight:var(--fw-med)}
.det .row .st-u{padding:0}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);margin:var(--s4) 0}
.acts a,.acts button{min-height:var(--act-h);padding:var(--s2) var(--s1);border-radius:var(--r-md);border:0;background:var(--surface);box-shadow:var(--sh-card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s1);color:var(--brand);text-decoration:none;font-size:var(--fs-sm);font-weight:var(--fw-med)}
.acts a.pri{grid-column:1/-1;flex-direction:row;gap:var(--s2);min-height:var(--act-pri-h);background:var(--brand);color:var(--on-brand);font-size:var(--fs-input);box-shadow:none}
.acts .off{color:var(--sub);opacity:.6;pointer-events:none;box-shadow:none;background:transparent}
.acts small{display:block;font-size:var(--fs-xs);font-weight:var(--fw-text);direction:ltr;white-space:nowrap;color:var(--sub);font-variant-numeric:tabular-nums}.acts a span{text-align:center}
.kbox{display:flex;gap:var(--s3);align-items:center;padding:var(--pad-card);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-card)}
.kbox .ks{flex:0 0 var(--kb-big);height:var(--kb-big);border-radius:50%;display:grid;place-items:center;color:var(--on-k);font-weight:var(--fw-head)!important}
.kbox .kt{font-size:var(--fs-sm);color:var(--sub);font-weight:var(--fw-med)}
.kbox .kn{font-size:var(--fs-input);font-weight:var(--fw-med);line-height:1.35}
.ksrc{font-size:var(--fs-xs);color:var(--sub);margin-top:var(--s1);line-height:1.45}
.dl{margin-top:10px;padding:var(--pad-card);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-card)}
.dl h4{margin:0 0 var(--s2);font-size:var(--fs-sm);color:var(--sub);font-weight:var(--fw-head)}
.hrs{display:grid;grid-template-columns:auto 1fr;gap:6px var(--s4);font-size:var(--fs-base);font-variant-numeric:tabular-nums}

<script>

<script>

};
const ico = p => ICO[p.f] || ICO['אחר'];
const IC = {

  back:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>'
};

// ---------- state ----------
const DEF = { open:false, hc:[], t:[], food:'', kind:'מסעדה', city:'', sort:'dist' };
const S = Object.assign({}, DEF, LS.get('kl3_f', {}), { q:'' });

const T = () => S.when ? new Date(S.when) : IL();

let INST = null; const STANDALONE = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; const IOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

// ---------- geo ----------
const km = (a, b) => { const dLa = rad(b.lat-a.lat), dLo = rad(b.lng-a.lng); const x = Math.sin(dLa/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLo/2)**2; return 12742*Math.asin(Math.sqrt(x)); };

const LLof = p => exact(p) ? p.g.loc : cityLL(p.c);

function distTxt(p, d) {

function nearestCity(ll) { let b = null, bd = 1e9; for (const c in CITY) { const d = km(ll, cityLL(c)); if (d < bd) { bd = d; b = c; } } return b; }

const fmtDate = s => { const [y, m, d] = String(s).split('-').map(Number); return y ? `${d} ב${MONTHS[m - 1]} ${y}` : ''; };

    if (cur) { const m = PLACES.find(p => p.n === cur.n && p.s === cur.s && p.c === cur.c && p.k === cur.k); sel = m ? m.id : null; }
    shown = 40; render();
  }).catch(() => {});

// links: ?p=<id> opens a place (shared links); ?open=1 and ?near=1 come from the home-screen shortcuts
const QS = new URLSearchParams(location.search);
if (QS.get('open') === '1') S.open = true;
render(); snap('peek'); initMap();
{ const p = QS.get('p') && byU(QS.get('p')); if (p) { detail(p); snap('half'); const ll = LLof(p); if (ll) setTimeout(() => panTo(ll), 600); } }
if (QS.get('near') === '1') gps();
if (QS.toString()) history.replaceState(null, '', location.pathname);
if (navigator.permissions) navigator.permissions.query({ name:'geolocation' }).then(r => { if (r.state === 'granted') gps(); }).catch(() => {});
})();
