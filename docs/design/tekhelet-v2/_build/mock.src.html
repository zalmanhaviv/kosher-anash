<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>כשר לאנ״ש – תכלת ואבן, גרסה 2 (הדמיה)</title>
<!-- S1-4 design proposal, direction "תכלת ואבן" v2. Self-contained: no network, no storage required, works in a sandboxed iframe.
     Data: real places from data/places.json; status from src/logic.js statusAt at Friday 27.11.2026 12:30 (Israel). Generated by _build/build.py.
     Map: a schematic drawing in the style colours (no tiles offline). Intended fonts: Suez One (display) + Assistant (text), both SIL OFL 1.1;
     when they are not installed, the system fallbacks in the font stacks are shown (FreeSerif Bold / Liberation Sans). -->
<style>
/*TOKENS*/
@font-face{font-family:"KA Display";src:local("Suez One"),local("SuezOne-Regular");font-weight:100 900;font-display:swap}
@font-face{font-family:"KA Text";src:local("Assistant"),local("Assistant Regular"),local("Assistant-Regular");font-weight:100 900;font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:#8B8478;font-family:var(--font-body);color:#1d1a16;direction:rtl}
/* ---- review chrome (not part of the design) ---- */
.rv{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 28px;background:#2A2722;color:#EDE6D8;font:500 14px/1.4 var(--font-body)}
.rv b{font:700 16px var(--font-display)}
.rv .seg{display:inline-flex;border:1px solid #6B655B;border-radius:6px;overflow:hidden}
.rv .seg button{font:inherit;background:transparent;color:inherit;border:0;padding:6px 12px;cursor:pointer}
.rv .seg button[aria-pressed=true]{background:#EDE6D8;color:#2A2722;font-weight:700}
.rv .seg button:focus-visible{outline:2px solid #8FC2EA;outline-offset:-2px}
.gal{display:flex;flex-wrap:wrap;gap:36px;padding:32px 28px;align-items:flex-start}
.gal figure{margin:0}.gal figcaption{font:600 14px/1.4 var(--font-body);color:#fff;margin-top:10px;max-width:390px}

/* ---- the app ---- */
.f{position:relative;overflow:hidden;isolation:isolate;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--fs-base);line-height:var(--lh-body);
   -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;user-select:none}
.f.phone{width:390px;height:844px}
.f.desk{width:1280px;height:800px}
.f button,.f input{font:inherit;color:inherit}
.f button{cursor:pointer}
.f :focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.f .q:focus-visible{outline:none}
.sbar:focus-within{box-shadow:0 0 0 2.5px var(--focus),var(--sh1)}
.num{font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1,"lnum" 1}
.disp{font-family:var(--font-display);font-weight:700;letter-spacing:0}

/* map */
.map{position:absolute;inset:0;background:var(--m-land);touch-action:none;cursor:grab}
.map.drag{cursor:grabbing}
.map svg.bgm{position:absolute;inset:0;display:block}
.mrl{font:700 11.5px var(--font-body);fill:var(--m-road-label);paint-order:stroke;stroke:var(--m-label-halo);stroke-width:3px;stroke-linejoin:round}
.mpl{font:700 13px var(--font-body);fill:var(--m-label);paint-order:stroke;stroke:var(--m-label-halo);stroke-width:3.5px;stroke-linejoin:round;text-anchor:middle}
.mpl.big{font-size:15.5px;letter-spacing:.2px}
.mwl{font:600 italic 11.5px var(--font-body);fill:var(--m-water-label);paint-order:stroke;stroke:var(--m-label-halo);stroke-width:3px}
.mk{position:absolute;left:0;top:0;z-index:3;border:0;padding:0;background:none;display:block;transform-origin:50% 100%;
    transition:transform var(--dur-fast) var(--ease)}
.mk::before{content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%)}
.mk svg{display:block;overflow:visible;filter:drop-shadow(0 1px 1.5px rgba(30,20,10,.35))}
.mk:active{transform:scale(.92)}
.mk.cl{transform-origin:50% 50%}
.mk.sel{z-index:6}
.mkl{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;pointer-events:none}
.mkt{font-family:var(--font-display);font-weight:700}
.attr{position:absolute;left:8px;}
.phone .attr{left:auto;right:8px;}
.attr{z-index:2;direction:ltr;font:500 10.5px var(--font-body);color:var(--sub);background:color-mix(in srgb,var(--surface) 82%,transparent);padding:1px 6px;border-radius:3px}

/* status bar of the phone frame */
.osbar{position:absolute;top:0;left:0;right:0;height:30px;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font:700 13px var(--font-body);color:var(--ink);background:color-mix(in srgb,var(--bg) 78%,transparent);pointer-events:none}

/* top: sign board + search, step chips */
.top{position:absolute;top:38px;right:12px;left:12px;z-index:30;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
.desk .top{right:16px;left:auto;width:420px;top:16px}
.f.carding .chips{opacity:0;pointer-events:none;transform:translateY(-6px)}
.chips{transition:opacity var(--dur-base),transform var(--dur-base) var(--ease)}
.sbar{display:flex;align-items:center;gap:6px;height:54px;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--sh1);padding:0 7px 0 4px}
.board{flex:0 0 auto;position:relative;height:40px;margin:0;display:flex;align-items:center;padding:1px 10px 0;border-radius:var(--r-sm);background:var(--brand);color:var(--brand-on);
       font:700 16.5px/1 var(--font-display);white-space:nowrap}
.board::after{content:"";position:absolute;inset:3px;border:1px solid color-mix(in srgb,var(--brand-on) 38%,transparent);border-radius:3px;pointer-events:none}
.qwrap{flex:1;min-width:0;display:flex;align-items:center;gap:5px;padding:0 4px 0 0;color:var(--mut)}
.qwrap svg{flex:0 0 auto}
.q{flex:1;min-width:0;border:0;background:transparent;height:44px;font-size:16px;color:var(--ink);outline:none;user-select:text}
.q::placeholder{color:var(--mut);opacity:1;font-size:15px}
.q::-webkit-search-cancel-button{display:none}
.ib{position:relative;flex:0 0 44px;width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;border-radius:var(--r-sm);color:var(--sub);
    transition:transform var(--dur-fast) var(--ease),background var(--dur-fast)}
.ib:active{transform:scale(.92);background:var(--surface2)}
.ib .bdg{position:absolute;top:6px;left:5px;min-width:17px;height:17px;padding:0 4px;border-radius:3px;background:var(--brand);color:var(--brand-on);font:700 11px/17px var(--font-body);text-align:center}
.ib[hidden],.bdg[hidden]{display:none}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:2px 12px 6px}
.chips::-webkit-scrollbar{display:none}
.desk .chips{margin:0 -4px;padding:2px 4px 6px}
.chip{flex:0 0 auto;height:38px;padding:0 13px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);
      box-shadow:inset 0 -2px 0 var(--line),0 1px 3px rgba(40,30,15,.10);font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px;white-space:nowrap;color:var(--ink);
      transition:transform var(--dur-fast) var(--ease),box-shadow var(--dur-fast),background var(--dur-fast),color var(--dur-fast)}
.chip:active{transform:translateY(1px);box-shadow:inset 0 -1px 0 var(--line)}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--brand-on);box-shadow:inset 0 -2px 0 color-mix(in srgb,#000 28%,var(--brand))}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--open);box-shadow:0 0 0 2px color-mix(in srgb,var(--open) 22%,transparent)}
.chip[aria-pressed=true] .dot{background:var(--brand-on);box-shadow:none}
.chip .n{font-weight:700;opacity:.9}

/* floating controls */
.fab{position:absolute;z-index:20;width:44px;height:44px;border-radius:var(--r-md);border:0;background:var(--surface);box-shadow:var(--sh1);display:grid;place-items:center;color:var(--brand-ink);
     transition:transform var(--dur-fast) var(--ease),opacity var(--dur-base)}
.fab:active{transform:scale(.92)}
.zoom{position:absolute;z-index:20;display:flex;flex-direction:column;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--sh1);overflow:hidden}
.zoom button{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;color:var(--sub)}
.zoom button+button{border-top:1px solid var(--line)}
.zoom button:active{background:var(--surface2)}

/* sheet: hewn lintel on top, plaster body */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:25;display:flex;flex-direction:column;filter:drop-shadow(0 -3px 10px rgba(40,28,12,.18));
       transition:transform var(--dur-slow) var(--ease);will-change:transform}
[data-theme=dark] .sheet{filter:drop-shadow(0 -6px 16px rgba(0,0,0,.55))}
.sheet.dragging{transition:none}
.desk .sheet{right:16px;left:auto;width:420px;top:136px;bottom:16px;filter:drop-shadow(0 4px 14px rgba(40,28,12,.18));transition:none}
.lintel{position:relative;flex:0 0 auto;background:var(--stone);color:var(--stone-ink);padding:15px 18px 13px;
        clip-path:polygon(0 7px,6% 4px,14% 6px,23% 3px,31% 5px,42% 2px,53% 4px,61% 1.5px,70% 4px,79% 2px,88% 5px,95% 3px,100% 6px,100% 100%,0 100%);
        touch-action:none;cursor:grab}
.desk .lintel{cursor:default}
/* drafted margin: the chiselled border band of an ashlar face */
.lintel::before{content:"";position:absolute;inset:9px 7px 6px;border:1px solid color-mix(in srgb,var(--stone-lo) 70%,transparent);border-radius:1px;
        box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--stone-hi) 80%,transparent);pointer-events:none}
.lintel::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--stone-lo);opacity:.8}
.notch{position:absolute;top:8px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:var(--stone-lo);box-shadow:0 1px 0 var(--stone-hi)}
.desk .notch{display:none}
.lrow{position:relative;display:flex;align-items:center;gap:12px;min-height:50px}
.ltitle{flex:1;min-width:0}
.ltitle h2{margin:0;font:700 var(--fs-xl)/var(--lh-tight) var(--font-display);text-wrap:balance}
.ltitle .cnt{display:block;font-size:var(--fs-sm);color:var(--sub);margin-top:3px;font-weight:600}
.plaque{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:6px 11px 6px 12px;border-radius:2px;background:var(--plaque);color:var(--plaque-ink);
        box-shadow:inset 0 0 0 1px rgba(255,255,255,.10),inset 0 -2px 0 rgba(0,0,0,.35),0 1px 0 var(--stone-hi)}
.plaque .pl{font-size:12px;line-height:1.25;font-weight:600}
.plaque .pt{font:700 23px/1 var(--font-body);color:var(--plaque-time);letter-spacing:.3px}
.plaque svg{color:var(--plaque-time)}
.lback{display:flex;align-items:center;gap:4px;height:44px;margin:-4px -6px -4px 0;padding:0 6px;border:0;background:transparent;font-weight:700;color:var(--stone-ink);border-radius:var(--r-sm)}
.lback:active{background:color-mix(in srgb,var(--stone-lo) 25%,transparent)}
.sbody{position:relative;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);scrollbar-width:thin;user-select:text}
.view{min-height:100%}
.view.in{animation:vin var(--dur-base) var(--ease) both}
.view.in.back{animation-name:vback}
@keyframes vin{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes vback{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}

/* list */
.note{margin:12px 18px 2px;font-size:var(--fs-sm);line-height:1.5;color:var(--sub);text-wrap:pretty}
.sec-h{display:flex;align-items:center;gap:10px;padding:16px 18px 4px;font:700 15px var(--font-display);color:var(--sub)}
.sec-h::after{content:"";flex:1;height:1px;background:var(--line)}
.sec-h .c{font:600 12.5px var(--font-body);color:var(--mut);margin-inline-start:-4px}
.item{position:relative;display:flex;gap:13px;align-items:flex-start;width:100%;text-align:right;border:0;background:transparent;padding:12px 18px 13px;
      transition:background var(--dur-fast),transform var(--dur-fast) var(--ease)}
.item+.item::before{content:"";position:absolute;top:0;right:57px;left:18px;height:1px;background:var(--line)}
.item:hover{background:color-mix(in srgb,var(--surface2) 60%,transparent)}
.item:active{background:var(--surface2);transform:scale(.995)}
.item .door{flex:0 0 26px;margin-top:3px}
.bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.r1{display:flex;align-items:flex-start;gap:10px}
.nm{flex:1;min-width:0;font:700 19px/1.25 var(--font-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:2px}
.l2{font-size:var(--fs-sm);color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kh{font-size:var(--fs-sm);font-weight:700}
.stl{font-size:var(--fs-sm);font-weight:600;margin-top:2px}
.k-chabad{color:var(--k-chabad-ink)}.k-eda{color:var(--k-eda-ink)}.k-landa{color:var(--k-landa-ink)}.k-products{color:var(--k-products-ink)}
.st-y{color:var(--open)}.st-s{color:var(--soon)}.st-u{color:var(--noinfo)}.st-n,.st-x{color:var(--closed)}
/* painted sign plate = status */
.plate{position:relative;flex:0 0 auto;display:inline-flex;align-items:center;height:28px;padding:1px 9px 0;border-radius:var(--r-xs);font:700 14px/1 var(--font-body);white-space:nowrap}
.plate::after{content:"";position:absolute;inset:2.5px;border:1px solid currentColor;opacity:.42;border-radius:2px;pointer-events:none}
.plate.p-y{background:var(--open-plate);color:var(--open-on)}
.plate.p-s{background:var(--soon-plate);color:var(--soon-on)}
.plate.big{height:34px;font-size:16px;padding:1px 12px 0}
.dbt{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--doubt);margin-top:3px}
.empty{padding:28px 24px 24px;text-align:center;color:var(--sub);text-wrap:balance}
.empty b{display:block;font:700 20px/1.3 var(--font-display);color:var(--ink);margin:10px 0 4px}
.empty svg{color:var(--stone-lo)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 18px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);
     font-weight:700;color:var(--brand-ink);transition:transform var(--dur-fast) var(--ease),background var(--dur-fast)}
.btn:active{transform:scale(.97);background:var(--surface2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-on)}
.foot{margin:18px 18px 28px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.55;color:var(--mut);text-wrap:pretty}

/* place card: door frame in tekhelet, stone threshold */
.det{padding:14px 16px 20px}
.frame{position:relative;margin:2px 6px 0;padding:30px 18px 16px;text-align:center;background:var(--surface);
       border:7px solid var(--paint);border-bottom:0;border-radius:50% 50% 0 0/58px 58px 0 0}
.frame::before{content:"";position:absolute;inset:2px 2px 0;border:1px solid var(--paint-hi);border-bottom:0;border-radius:50% 50% 0 0/52px 52px 0 0;opacity:.55;pointer-events:none}
.frame h3{margin:0 0 4px;font:700 var(--fs-xxl)/var(--lh-title) var(--font-display);text-wrap:balance}
.frame .addr{color:var(--sub);font-size:var(--fs-md)}
.frame .meta{color:var(--sub);font-size:var(--fs-sm);margin-top:1px}
.frame .stw{margin-top:12px;display:flex;justify-content:center}
.frame .stw .stl{font-size:var(--fs-md);font-weight:700;max-width:30ch;text-wrap:balance}
.sill{height:11px;margin:0 -2px;background:var(--stone);border-top:1px solid var(--stone-hi);border-bottom:2px solid var(--stone-lo);border-radius:1px}
.fav{position:absolute;top:8px;left:6px;width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;color:var(--sub);border-radius:50%;
     transition:transform var(--dur-fast) var(--ease),color var(--dur-fast)}
.fav:active{transform:scale(.88)}
.fav[aria-pressed=true]{color:var(--k-chabad)}
.fav[aria-pressed=true] svg path{fill:currentColor}
.kbox{display:flex;gap:13px;align-items:center;margin-top:16px;padding:12px 14px;border-radius:var(--r-md);background:var(--surface2)}
.kbox .door{flex:0 0 40px}
.kbox .kt{font-size:12.5px;color:var(--sub);font-weight:600}
.kbox .kn{font-size:17px;font-weight:700;line-height:1.3;color:var(--ink)}
.kbox .ksrc{font-size:12.5px;color:var(--sub);margin-top:1px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 4px}
.act{height:64px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
     color:var(--brand-ink);font-size:13.5px;font-weight:700;line-height:1.1;transition:transform var(--dur-fast) var(--ease),background var(--dur-fast)}
.act:active{transform:scale(.96);background:var(--surface2)}
.act.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-on)}
.act.pri:active{background:color-mix(in srgb,#000 12%,var(--brand))}
.act svg{flex:0 0 auto}.act>span{display:flex;flex-direction:column;align-items:center}
.act small{display:block;direction:ltr;font-size:11px;font-weight:600;color:var(--sub);margin-top:1px}
.dl{margin-top:18px}
.dl h4{display:flex;align-items:center;gap:10px;margin:0 0 6px;font:700 15px var(--font-display);color:var(--sub)}
.dl h4::after{content:"";flex:1;height:1px;background:var(--line)}
.hrs{display:grid;grid-template-columns:auto 1fr auto;font-size:var(--fs-md)}
.hrs>div{display:contents}
.hrs span{padding:4px 10px;line-height:1.45}
.hrs .tday span{background:var(--brand-soft);color:var(--brand-ink);font-weight:700}
.hrs .tday span:first-child{border-radius:0 var(--r-sm) var(--r-sm) 0}
.hrs .tday span:last-child{border-radius:var(--r-sm) 0 0 var(--r-sm)}
.hrs .tg{font-size:12px;font-weight:700;align-self:center}
.hrs bdi{unicode-bidi:isolate;direction:ltr}
.doubt{display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding:9px 11px;border-radius:var(--r-sm);background:var(--doubt-bg);color:var(--doubt);font-size:var(--fs-sm);font-weight:700;line-height:1.45}
.doubt svg{flex:0 0 auto;margin-top:1px}
.src{font-size:var(--fs-sm);color:var(--mut);margin-top:8px;line-height:1.5;text-wrap:pretty}
.src.cn{display:flex;align-items:center;gap:6px;color:var(--sub);font-weight:600}
.warn{font-size:var(--fs-sm);color:var(--mut);margin:16px 0 0;line-height:1.5}
.report-slot{height:0}

/* small sheets (filters, time) */
.scrim{position:absolute;inset:0;z-index:60;background:rgba(25,18,10,.32);opacity:0;pointer-events:none;transition:opacity var(--dur-base)}
.scrim.on{opacity:1;pointer-events:auto}
.pop{position:absolute;left:0;right:0;bottom:0;z-index:61;transform:translateY(105%);transition:transform var(--dur-slow) var(--ease);filter:drop-shadow(0 -4px 14px rgba(0,0,0,.2))}
.desk .pop{left:auto;right:16px;width:420px;bottom:16px}
.pop.on{transform:none}
.pop .lintel{cursor:default}
.pop .pb{background:var(--surface);padding:6px 18px 18px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:right;font-size:16px;font-weight:600;padding:4px 2px}
.opt:active{background:var(--surface2)}
.opt .grow{flex:1}
.opt .chk{width:22px;height:22px;border-radius:4px;border:2px solid var(--mut);display:grid;place-items:center;color:transparent;transition:background var(--dur-fast)}
.opt[aria-checked=true] .chk{background:var(--brand);border-color:var(--brand);color:var(--brand-on)}
.opt .rad{width:22px;height:22px;border-radius:50%;border:2px solid var(--mut);display:grid;place-items:center}
.opt[aria-checked=true] .rad{border-color:var(--brand)}
.opt[aria-checked=true] .rad::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--brand)}
.opt small{display:block;font-size:13px;color:var(--sub);font-weight:500}
.pbar{display:flex;gap:10px;margin-top:14px}
.pbar .btn{flex:1}

/* toast = small basalt plaque */
.toast{position:absolute;left:50%;bottom:24px;z-index:70;transform:translate(-50%,16px);opacity:0;max-width:340px;padding:10px 14px;border-radius:3px;background:var(--plaque);color:var(--plaque-ink);
       font-size:14px;font-weight:600;line-height:1.45;text-align:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 6px 18px rgba(0,0,0,.3);transition:opacity var(--dur-base),transform var(--dur-base) var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

      el.querySelector('.pb').innerHTML = `${Object.keys(HC).map(k => `<button class="opt" role="checkbox" data-k="${k}" aria-checked="${S.hc.includes(k)}"><span class="door" style="flex:0 0 26px">${doorSVG(k, { step: false })}</span><span class="grow">${HC[k]}<small>${k === 'products' ? 'סמן חלול' : 'כשרות ' + HC[k]}</small></span><span class="chk">${ic('check', 16)}</span></button>`).join('')}
        <div class="pbar"><button class="btn reset">ניקוי סינון</button><button class="btn pri done">הצגת ${nPl(n)}</button></div>`;
      el.querySelectorAll('.opt').forEach(b => b.onclick = () => { const k = b.dataset.k; S.hc = S.hc.includes(k) ? S.hc.filter(x => x !== k) : [...S.hc, k]; S.sel = null; draw(el); render(); el.querySelector(`[data-k=${k}]`).focus(); });
      el.querySelector('.reset').onclick = () => { closePop(); clearAll(); };
      el.querySelector('.done').onclick = closePop;
    };
    openPop(popHead('סינון לפי כשרות') + '<div class="pb" role="group" aria-label="כשרות"></div>', el => { el.querySelector('.pclose').onclick = closePop; draw(el); });
  }
  $('.flt').onclick = filterDlg;
  let tt; function toast(m) { const t = $('.toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2600); }

  setSnap(1, true); render(); requestAnimationFrame(() => sheet.classList.remove('dragging'));
  return { open: (n, o) => { const p = D.places.find(x => x.n === n); open(p.u, o || { quiet: true }); }, close, setSnap, render: () => render(), S, V, draw: drawMap };
}

// theme: follows the system; the review bar can force light or dark
const frames = [document.getElementById('phone'), document.getElementById('desk')];
let themeMode = 'auto';
try { themeMode = sessionStorage.getItem('ka-theme') || 'auto'; } catch (e) { }
const mq = matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const t = themeMode === 'auto' ? (mq.matches ? 'dark' : 'light') : themeMode;
  frames.forEach(f => f.dataset.theme = t);
  document.querySelectorAll('#themeSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === themeMode));
}
mq.addEventListener && mq.addEventListener('change', applyTheme);
document.getElementById('themeSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; themeMode = b.dataset.t; try { sessionStorage.setItem('ka-theme', themeMode); } catch (e) { } applyTheme(); });
applyTheme();
window.KA = { phone: App(frames[0], 'phone'), desk: App(frames[1], 'desk'), theme: t => { themeMode = t; applyTheme(); } };
})();
</script>
