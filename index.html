:root{

  /* spacing (4px scale) */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s7:32px;--s8:40px;
  /* sizes: tap targets >= 44px */
  --tap:44px;--search-h:50px;--chip-h:44px;--btn-h:48px;--fab:48px;--act-h:58px;--kb:40px;--kb-big:48px;--kb-mini:20px;--act-pri-h:52px;--row-h:80px;--pad-card:14px;--peek:168px;--sheet-gap:64px;--desk-top:140px;--desk-attr:432px;--toast-top:128px;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:focus{outline:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
/* svg fallback map labels use the app font */
text{font-family:var(--font)!important}

/* ---------- map ---------- */
#map{position:fixed;inset:0;z-index:0;background:var(--map-bg)}
#svgmap{position:fixed;inset:0;width:100%;height:100%;z-index:0;background:var(--map-bg)}

/* ---------- top bar: translucent search + chips over the map ---------- */
.topbar{position:fixed;top:calc(var(--s3) + var(--st));right:var(--s3);left:var(--s3);z-index:30;display:flex;flex-direction:column;gap:var(--s2);pointer-events:none}

.brandmark{margin:0;flex:0 0 auto;font-weight:var(--fw-head);font-size:var(--fs-input);color:var(--ink);padding:0 var(--s1);letter-spacing:var(--ls-title);white-space:nowrap}
.sbar .sep{width:1px;height:var(--s6);background:var(--line)}

.sbar input::placeholder{color:var(--sub);opacity:1}
.sbar:focus-within{box-shadow:0 0 0 2px var(--focus),var(--sh-search)}
.ibtn{flex:0 0 var(--tap);height:var(--tap);border:0;background:transparent;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--sub);position:relative}

.chips{display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none;padding:2px var(--s3) var(--s1);margin:0 calc(-1 * var(--s3))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:var(--chip-h);padding:0 var(--s4);border-radius:var(--r-xl);border:0;background:var(--glass-chip);box-shadow:var(--sh-chip);font-size:var(--fs-md);font-weight:var(--fw-med);color:var(--ink);display:flex;align-items:center;gap:6px;white-space:nowrap;font-variant-numeric:tabular-nums;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}

.offl{padding:var(--s2) var(--s3);border-radius:var(--r-sm);background:var(--warn-bg);color:var(--warn-ink);font-size:var(--fs-sm);font-weight:var(--fw-med);text-align:center;box-shadow:var(--sh-float)}

.sbody{flex:1;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;padding:0 var(--s4) calc(var(--s4) + var(--sb))}

.item:hover{background:var(--surface-hover)}

[class^="st-"]{font-variant-numeric:tabular-nums}
.k-chabad{color:var(--chabad)}.k-eda{color:var(--eda)}.k-landa{color:var(--landa)}.k-products{color:var(--products)}

// one name per food type everywhere: the dialog uses the chip's label where there is a chip (P1-13)

// ---------- planning: "when?" ----------
const dayName = (d, base = IL()) => { const a = new Date(base); a.setHours(0,0,0,0); const b = new Date(d); b.setHours(0,0,0,0); const k = Math.round((b - a) / 864e5); return k === 0 ? 'היום' : k === 1 ? 'מחר' : (d.getDay() === 5 ? 'שישי' : 'יום ' + DAYS[d.getDay()]); };

function nextDay(dow, h, m) { const d = IL(); d.setSeconds(0, 0); const add = (dow - d.getDay() + 7) % 7; d.setDate(d.getDate() + add); d.setHours(h, m); if (d < IL()) d.setDate(d.getDate() + 7); return d; }
// Day + hour follow the same rules as the quick picks (QA2-3): no hour that has passed, nothing on Friday from 14:00,

const WHEN_FROM = 6 * 60, WHEN_TO = 23 * 60 + 30, FRI_LAST = 14 * 60;
function whenTimes(dayTs) {
  const d = new Date(dayTs), now = IL(), today = new Date(now); today.setHours(0, 0, 0, 0);
  const isToday = +d === +today, nowM = now.getHours() * 60 + now.getMinutes(), out = [];
  if (d.getDay() === 6 && !isToday) return out;

    out.push(m);
  }

}
function whenDlg() {
  const base = S.when ? new Date(S.when) : IL();

  const curDay = new Date(base); curDay.setHours(0,0,0,0);
  // the day "הצגה" uses is always marked: the chosen day, else the first day offered (today when it has hours left)
  let day = days.some(d => +d === +curDay) ? +curDay : days.length ? +days[0] : +curDay;
  const bm = base.getHours()*60 + (base.getMinutes() < 30 ? 0 : 30);
  const timeOpts = (dts, want) => { const ts = whenTimes(dts), pick = ts.includes(want) ? want : ts[0]; return ts.map(m => `<option value="${m}"${m === pick ? ' selected' : ''}>${hhmm(m)}</option>`).join(''); };
  const o = (on, attr, label) => `<button class="opt${on?' on':''}" ${attr}>${label}</button>`;

    .filter(x => x.d > now && x.d - now < 6 * 864e5 && !(x.d.getDay() === 5 && x.d.getHours() >= 14))

  openDlg(`<h3 tabindex="-1">מתי רוצים להגיע?</h3>
    <div class="fg"><h4>מהיר</h4><div class="opts">${o(!S.when,'data-now="1"','עכשיו')}${pres}</div></div>
    ${days.length ? `<div class="fg"><h4>יום</h4><div class="opts">${days.map(d => `<button class="opt${+d === day ? ' on' : ''}" data-day="${+d}" aria-pressed="${+d === day}">${dayName(d)}</button>`).join('')}</div></div>
    <div class="fg"><h4>שעה</h4><select class="sel" id="wTime">${timeOpts(day, bm)}</select></div>` : ''}
    <div class="dbar"><button class="btn ghost" id="wNow">עכשיו</button>${days.length ? '<button class="btn pri" id="wOk">הצגה</button>' : ''}</div>`);
  const apply = () => { const m = +$('wTime').value; const d = new Date(day); d.setHours(Math.floor(m/60), m % 60, 0, 0); S.when = +d; };
  $('dlg').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.now || b.id === 'wNow') { S.when = null; closeDlg(); sel = null; shown = 40; render(); return; }

}

// ---------- GPS ----------
function gps() {
  if (!navigator.geolocation) return toast('איתור מיקום לא נתמך במכשיר הזה');

}

// ---------- misc ----------
let tt; function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2300); }
let qt; $('q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value; sel = null; shown = 40; render(); if (S.q && snapName === 'peek') snap('half'); }, 140); });
$('cOpen').onclick = () => { S.open = !S.open; if (S.open) S.fri = false; sel = null; shown = 40; render(); };
$('cFri').onclick = () => { S.fri = !S.fri; if (S.fri) { S.open = false; S.when = null; } sel = null; shown = 40; render(); };
document.querySelectorAll('.chip[data-t]').forEach(b => b.onclick = () => { const v = b.dataset.t; S.t = S.t.includes(v) ? S.t.filter(x=>x!==v) : [...S.t, v]; sel = null; shown = 40; render(); });

$('fBtn').onclick = filters;
$('cWhen').onclick = whenDlg;
$('meBtn').onclick = () => ME && map ? ease({ center:[ME.lng, ME.lat], zoom:15 }) : gps();
$('sbody').addEventListener('mouseover', e => { const it = e.target.closest('.item'); if (it && wide()) hoverMk(+it.dataset.id, true); });
$('sbody').addEventListener('mouseout', e => { const it = e.target.closest('.item'); if (it && wide() && !it.contains(e.relatedTarget)) hoverMk(+it.dataset.id, false); });
$('sbody').addEventListener('click', e => { const it = e.target.closest('.item'); if (it) return detail(PLACES[+it.dataset.id]); const rc = e.target.closest('[data-rec]'); if (rc) { const p = byU(rc.dataset.rec); if (p) detail(p); } });

// Statuses refresh every minute and when the app comes back to the screen. The refresh keeps what the user is doing:
// focus, list or card scroll, the open card, an open dialog and the caret in the search box (P1-11)
function keepView(fn) {
  const sb = $('sbody'), a = document.activeElement, top = sb.scrollTop, q = $('q');
  const FOC = 'a[href],button,select,input,[tabindex]';
  let key = null, idx = -1;

}
const refresh = () => { if (document.visibilityState === 'visible' && !$('sheet').classList.contains('drag')) keepView(render); };
setInterval(refresh, 60000);
document.addEventListener('visibilitychange', refresh);

addEventListener('beforeinstallprompt', e => { e.preventDefault(); INST = e; render(); });

// ---------- live data from GitHub: a data change needs no new upload to Netlify ----------
// The built-in copy shows instantly (and offline); a newer copy from the repository replaces it when it arrives.
const RAW = 'https://raw.githubusercontent.com/zalmanhaviv/kosher-anash/main/data/';
// Gate for remote data: every field the UI uses must have the shape data/schema.json allows (same allowed values);
// one bad row rejects the whole set and the built-in copy stays. Unknown extra fields are ignored (the UI never reads them).

  && isObj(g.loc) && isNum(g.loc.lat) && isNum(g.loc.lng) && g.loc.lat >= 29.3 && g.loc.lat <= 33.5 && g.loc.lng >= 34.2 && g.loc.lng <= 35.95
  && PREC_OK.includes(g.prec)
  && isStr(g.chk) && /^20\d\d-(0[1-9]|1[0-2])$/.test(g.chk)

  && (g.periods === undefined || (Array.isArray(g.periods) && g.periods.every(okPeriod)))

  && (g.q === undefined || (Array.isArray(g.q) && g.q.every(isStr)));

  && isStr(p.u) && /^[0-9a-f]{7,8}$/.test(p.u)
  && isStr(p.n) && p.n !== '' && isStr(p.s) && isStr(p.c) && p.c !== '' && isStr(p.h) && p.h !== ''
  && isStr(p.tt)
  && K_OK.includes(p.k) && F_OK.includes(p.f) && Object.prototype.hasOwnProperty.call(HC, p.hc)
  && Array.isArray(p.t) && p.t.every(t => T_OK.includes(t)) && new Set(p.t).size === p.t.length
  && (p.p === '' || (isStr(p.p) && PH.test(p.p)))
  && typeof p.fri === 'boolean'
  && (p.aka === undefined || (Array.isArray(p.aka) && p.aka.every(x => isStr(x) && /^[0-9a-f]{7,8}$/.test(x))))
  && (p.g === undefined || okG(p.g));

  && !a.some(p => (p.aka || []).some(x => a.some(q => q.u === x))); // an alias never points at a live id

const okMeta = m => isObj(m) && isStr(m.updated) && /^20\d\d-\d\d-\d\d$/.test(m.updated) && Number.isInteger(m.rev) && m.rev >= 1;
// meta.json first (tiny); places.json and cities.json only when rev went up, so a visit with no data change downloads
// almost nothing. cities.json is optional: valid towns are merged (a new town gets its centre), otherwise ignored (P1-16)
const getRaw = f => fetch(RAW + f, { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null);
getRaw('meta.json').then(meta => {
  // rev goes up with every data change, so a same-day update is picked up too
  if (!okMeta(meta) || meta.rev <= DATA_REV) return;
  return Promise.all([getRaw('places.json'), getRaw('cities.json')]).then(([a, cities]) => {
    if (!okSet(a)) return;
    if (okCities(cities)) Object.assign(CITY, cities);
    const cur = sel != null ? PLACES[sel] : null;
    PLACES.length = 0;
    a.forEach((p, i) => { p.id = i; p.hay = norm([p.n,p.s,p.c,p.h,p.f,p.tt,HC[p.hc]].join(' ')); PLACES.push(p); });
    DATA_UPDATED = meta.updated; DATA_REV = meta.rev | 0;
    if (cur) { const m = byU(cur.u); sel = m ? m.id : null; } // by the permanent id (or its alias), not by name
    migrateIds(); shown = 40; keepView(render);
  });
}).catch(() => {});

// links: ?p=<id> opens a place (shared links); ?open=1 and ?near=1 come from the home-screen shortcuts
const QS = new URLSearchParams(location.search);
if (QS.get('open') === '1') S.open = true;
migrateIds();
// the address is cleaned before any history entry is added, so Back from a shared card returns to the list, not to ?p=
if (QS.toString() || hDepth()) history.replaceState(null, '', location.pathname);
render(); snap('peek'); initMap();
{ const p = QS.get('p') && byU(QS.get('p')); if (p) { detail(p, false, true); snap('half'); const ll = LLof(p); if (ll) setTimeout(() => panTo(ll), 600); } }
if (QS.get('near') === '1') gps();

})();
